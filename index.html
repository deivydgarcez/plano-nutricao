<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Plano Semanal · Muay Thai + Força</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#a855f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plano">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08050f;--surf:#0f0b1c;--card:#15112a;--card2:#1c1735;
  --bdr:#261f42;--bdr2:#342d58;
  --ember:#a855f7;--ember-s:#c084fc;--ember-d:rgba(168,85,247,.15);
  --teal:#22d3ee;--teal-s:#67e8f9;--teal-d:rgba(34,211,238,.12);
  --gold:#fbbf24;--gold-s:#fcd34d;--gold-d:rgba(251,191,36,.12);
  --blue:#a855f7;--blue-d:rgba(168,85,247,.12);
  --green:#34d399;--green-d:rgba(52,211,153,.12);
  --violet:#f472b6;--violet-d:rgba(244,114,182,.12);
  --txt:#ffffff;--muted:#b8b0d4;--faint:#4e4570;
  --day:#a855f7;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
  font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased;
  overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100dvh;max-width:500px;
  margin:0 auto;position:relative;overflow:hidden}

/* HEADER */
.hdr{padding:10px 20px 8px;flex-shrink:0;background:var(--bg);
  border-bottom:1px solid var(--bdr)}
/* HEADER HORIZONTAL */
.hdr-main{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.hdr-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.hdr-info-top{display:flex;align-items:flex-start;justify-content:space-between;gap:4px}
.hdr-info-bot{display:flex;align-items:center;gap:7px}
.hdr-info-left{min-width:0;flex:1}
.hdr-day{font-family:'Anton',sans-serif;font-size:22px;letter-spacing:.01em;
  text-transform:uppercase;line-height:1}
.hdr-date{font-size:11px;color:var(--faint);margin-top:3px}
.week-badge{font-size:11px;color:var(--faint);letter-spacing:.03em;white-space:nowrap}
.week-badge b{color:var(--muted);font-weight:500}
/* RING */
.ring-wrap{position:relative;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pring{display:block;filter:drop-shadow(0 0 16px rgba(168,85,247,.5))}
.ring-center{position:absolute;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center}
.ring-prot{font-family:'Anton',sans-serif;font-size:18px;line-height:1;color:var(--txt)}
.ring-goal{font-size:9px;color:var(--muted);margin-top:2px}
.kcal-chip{font-size:11.5px;font-weight:600;color:var(--muted);background:var(--surf);
  border:1px solid var(--bdr);border-radius:100px;padding:4px 12px}
.kcal-chip.surplus{color:var(--teal);background:var(--teal-d);border-color:rgba(34,211,238,.25)}
.kcal-chip.deficit{color:var(--ember-s);background:var(--ember-d);border-color:rgba(168,85,247,.25)}
.pills{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
  flex-wrap:nowrap;justify-content:flex-start;
  margin-top:5px;padding-bottom:2px;touch-action:pan-x}
.pills::-webkit-scrollbar{display:none}
.pill{flex-shrink:0;padding:6px 14px;border-radius:100px;font-size:10.5px;
  font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  border:1.5px solid var(--bdr);background:none;color:var(--faint);
  cursor:pointer;transition:all .2s}
.pill.on{background:var(--day);border-color:var(--day);color:#fff}

/* WATER COMPACT */
.water-compact{font-size:11.5px;font-weight:600;color:var(--muted);background:var(--surf);
  border:1px solid var(--bdr);border-radius:100px;padding:4px 12px;
  cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .2s;
  -webkit-tap-highlight-color:transparent}
.water-compact:active{background:var(--blue-d);border-color:var(--ember)}
/* PROGRESS */
.pbar-wrap{margin-top:10px;background:var(--surf);border-radius:12px;padding:10px 14px}
.pbar-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.pbar-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.pbar-val{font-family:'Anton',sans-serif;font-size:15px}
.pbar-val small{font-family:'DM Sans';font-size:10px;color:var(--muted);margin-left:2px}
.ptrack{height:6px;background:var(--bdr);border-radius:4px;overflow:hidden}
.pfill{height:100%;background:linear-gradient(90deg,var(--teal),var(--teal-s));border-radius:4px;
  transition:width .4s cubic-bezier(.4,0,.2,1);width:0}
.water{margin-top:8px;background:var(--blue-d);border:1px solid rgba(168,85,247,.25);
  border-radius:8px;padding:7px 12px;font-size:11.5px;color:var(--blue);
  display:flex;gap:8px;align-items:center}
.water b{font-weight:600}

/* RESET BANNER (hidden by default) */
.reset-banner{display:none;margin-top:8px;background:var(--teal-d);
  border:1px solid rgba(34,211,238,.35);border-radius:8px;
  padding:8px 12px;font-size:11.5px;color:var(--teal);
  justify-content:space-between;align-items:center;gap:10px}
.reset-banner.show{display:flex}
.reset-banner b{font-weight:600}
.reset-btn{font-size:11px;font-weight:600;color:var(--teal);background:var(--teal-d);
  border:1px solid rgba(34,211,238,.4);border-radius:6px;
  padding:4px 10px;cursor:pointer;white-space:nowrap}

/* MAIN */
main{flex:1;overflow-y:auto;padding:18px 20px 90px;
  scrollbar-width:thin;scrollbar-color:var(--bdr) transparent;
  -webkit-overflow-scrolling:touch;overscroll-behavior-y:none}
main::-webkit-scrollbar{width:3px}
main::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:2px}
.sec{display:none}.sec.on{display:block}
.sec-title{font-family:'Anton',sans-serif;font-size:22px;text-transform:uppercase;
  letter-spacing:.02em;margin-bottom:18px;padding-bottom:12px;
  border-bottom:1px solid var(--bdr)}

/* TIMELINE */
.tl{position:relative;padding-left:44px}
.tl::before{content:'';position:absolute;left:14px;top:10px;bottom:10px;
  width:1px;background:linear-gradient(var(--bdr2),transparent)}
.tl-row{position:relative;margin-bottom:10px;animation:rise .35s ease both}
.tl-row:nth-child(1){animation-delay:.03s}.tl-row:nth-child(2){animation-delay:.08s}
.tl-row:nth-child(3){animation-delay:.13s}.tl-row:nth-child(4){animation-delay:.18s}
.tl-row:nth-child(5){animation-delay:.23s}.tl-row:nth-child(6){animation-delay:.28s}
.tl-row:nth-child(7){animation-delay:.33s}
.tl-row::before{content:'';position:absolute;left:-32px;top:18px;
  width:8px;height:8px;border-radius:50%;background:var(--day);
  box-shadow:0 0 0 3px var(--bg)}
.mc{background:var(--card);border:1px solid var(--bdr);border-radius:20px;
  overflow:hidden;transition:border-color .2s,background .2s;cursor:pointer}
.mc:hover{border-color:rgba(168,85,247,.3)}
.mc.done{background:var(--bg);border-color:rgba(34,211,238,.2);box-shadow:inset 3px 0 0 var(--teal)}
.mc.done .mc-name{color:var(--faint)}
.mc.done .mc-time{color:var(--faint)}

/* DAY SUMMARY */
.day-summary{display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:var(--surf);border:1px solid var(--bdr);border-radius:14px;
  padding:9px 14px;margin-bottom:14px;font-size:12px;flex-wrap:wrap}
.ds-meals{font-weight:600;color:var(--txt);white-space:nowrap}
.ds-prot{color:var(--muted);white-space:nowrap}
.mc-head{display:flex;align-items:center;gap:10px;padding:14px 16px}
.mc-time{font-size:10px;font-weight:600;letter-spacing:.04em;color:var(--muted);
  padding:0;white-space:nowrap;flex-shrink:0}
.mc-name{font-size:15px;font-weight:500;flex:1;line-height:1.3}
.mc-prot{font-size:11px;font-weight:600;color:var(--teal);
  white-space:nowrap;flex-shrink:0}
.mc-chk{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--bdr2);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  font-size:11px;transition:all .2s;color:transparent}
.mc.done .mc-chk{background:var(--teal);border-color:var(--teal);color:#fff}
.mc-sum{font-size:11.5px;color:var(--faint);padding:0 16px 12px;
  line-height:1.45;margin-top:-4px}
.mc.done .mc-sum{color:var(--faint)}
.mc-body{display:none;padding:0 16px 12px;border-top:1px solid var(--bdr);padding-top:12px}
.mc.open .mc-body{display:block}
.mc.open .mc-sum{display:none}
.mc-food{font-size:13.5px;color:var(--muted);line-height:1.65;font-weight:400}
.mc-supp{margin-top:8px;font-size:11.5px;color:var(--faint);font-style:italic;
  padding-top:8px;border-top:1px solid var(--bdr)}
.mc-supp::before{content:'+ ';color:var(--teal)}
.mc-warn{margin-top:8px;font-size:11.5px;color:var(--gold);
  background:var(--gold-d);padding:7px 10px;border-radius:7px;line-height:1.4}
.mc-gastro{margin-top:8px;font-size:11px;color:var(--violet);
  background:var(--violet-d);padding:7px 10px;border-radius:7px;line-height:1.4}
.tn{background:var(--card);border:1px solid rgba(168,85,247,.25);border-radius:18px;
  padding:12px 14px;display:flex;align-items:center;gap:12px;margin-bottom:9px;
  box-shadow:inset 4px 0 0 var(--day);animation:rise .35s ease .23s both}
.tn-dot{width:10px;height:10px;border-radius:50%;background:var(--day);
  flex-shrink:0;box-shadow:0 0 10px var(--day)}
.tn-time{font-size:9px;font-weight:600;color:var(--day);letter-spacing:.06em;text-transform:uppercase}
.tn-name{font-family:'Anton',sans-serif;font-size:15px;text-transform:uppercase;letter-spacing:.04em}
.tn-desc{font-size:11px;color:var(--muted);margin-top:2px}
.total{background:var(--surf);border:1px solid var(--bdr);
  border-radius:18px;padding:12px 16px;display:flex;
  justify-content:space-between;align-items:center;margin-top:8px}
.total-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.total-val{font-family:'Anton',sans-serif;font-size:20px;color:var(--ember-s)}
.ibox{background:var(--card);border:1px dashed var(--bdr);border-radius:10px;
  padding:10px 13px;font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:8px}

/* SUPPS */
.supp-card{background:var(--card);border:1px solid var(--bdr);border-radius:20px;
  padding:14px 16px;margin-bottom:8px;display:grid;
  grid-template-columns:1fr auto;gap:3px 12px}
.supp-when{font-size:9.5px;font-weight:600;color:var(--ember);
  letter-spacing:.06em;text-transform:uppercase}
.supp-dose{font-family:'Anton',sans-serif;font-size:17px;color:var(--ember-s);
  grid-row:1/3;grid-column:2;align-self:center;text-align:right;line-height:1.2}
.supp-name{font-size:14px;font-weight:500}
.supp-note{font-size:11.5px;color:var(--muted);line-height:1.45;margin-top:3px;grid-column:1}
.supp-card.gc{background:var(--violet-d);border-color:rgba(155,94,212,.3)}
.supp-card.gc .supp-when{color:var(--violet)}
.supp-card.gc .supp-dose{color:var(--violet)}

/* PREP */
.prep-card{background:var(--card);border:1px solid var(--bdr);border-radius:20px;
  padding:16px;margin-bottom:10px}
.prep-hed{font-family:'Anton',sans-serif;font-size:16px;text-transform:uppercase;
  letter-spacing:.03em;margin-bottom:10px}
.prep-step{display:flex;gap:9px;margin-bottom:8px;font-size:12.5px;
  color:var(--muted);line-height:1.5}
.prep-n{width:21px;height:21px;border-radius:50%;background:var(--ember-d);
  color:var(--ember);font-size:10px;font-weight:600;display:flex;
  align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.prep-tip{margin-top:10px;padding:9px 11px;border-radius:8px;font-size:11.5px;line-height:1.5}
.prep-tip.green{background:var(--teal-d);color:var(--teal)}
.prep-tip.gold{background:var(--gold-d);color:var(--gold)}

/* GASTRITE */
.gbox{background:var(--card);border:1px solid rgba(155,98,232,.2);
  border-radius:20px;padding:14px 16px;margin-bottom:8px;
  display:flex;gap:12px;align-items:flex-start;
  box-shadow:inset 4px 0 0 var(--violet)}
.gbox-icon{font-size:18px;flex-shrink:0;margin-top:1px}
.gbox-title{font-size:13px;font-weight:600;color:var(--violet);margin-bottom:3px}
.gbox-body{font-size:11.5px;color:var(--muted);line-height:1.45}

/* MONTHLY SHOPPING */
.mcard{background:var(--card);border:1px solid var(--bdr);border-radius:20px;
  padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:border-color .2s}
.mcard:hover{border-color:rgba(168,85,247,.35)}
.mcard-top{display:flex;align-items:center;gap:10px}
.mcard-e{font-size:20px;flex-shrink:0}
.mcard-info{flex:1;min-width:0}
.mcard-name{font-size:14px;font-weight:500;margin-bottom:1px}
.mcard-tip{font-size:10.5px;color:var(--faint);font-style:italic}
.mcard-qty{font-family:'Anton',sans-serif;font-size:13px;color:var(--teal);
  white-space:nowrap;flex-shrink:0;text-align:right;line-height:1.2}
.mcard-macros{display:none;margin-top:10px;padding-top:10px;
  border-top:1px solid var(--bdr)}
.mcard.open .mcard-macros{display:block}
.mcard-por{font-size:10px;color:var(--faint);text-transform:uppercase;
  letter-spacing:.06em;margin-bottom:7px}
.mcard-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mcard-m{background:var(--surf);border-radius:8px;padding:7px 6px;
  display:flex;flex-direction:column;align-items:center;gap:2px}
.mcard-m.kcal{background:var(--ember-d)}
.mcard-m.kcal .mm-val{color:var(--ember-s)}
.mm-val{font-family:'Anton',sans-serif;font-size:15px;color:var(--teal);line-height:1}
.mm-lbl{font-size:9px;color:var(--faint);text-transform:uppercase;letter-spacing:.04em}

/* SHOP */
.shop-cat{font-size:9.5px;font-weight:600;color:var(--ember);
  letter-spacing:.14em;text-transform:uppercase;margin:14px 0 7px;padding-left:2px}
.shop-cat:first-child{margin-top:0}
.shop-row{background:var(--card);border:1px solid var(--bdr);border-radius:18px;
  padding:13px 14px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start}
.shop-emoji{font-size:21px;flex-shrink:0;margin-top:2px}
.shop-info{flex:1;min-width:0}
.shop-name{font-size:13px;font-weight:500;margin-bottom:2px}
.shop-body{font-size:11.5px;color:var(--muted);line-height:1.4;margin-bottom:3px}
.shop-where{font-size:10.5px;color:var(--faint);font-style:italic}
.shop-tag{font-size:9.5px;color:var(--teal);background:var(--teal-d);
  padding:2px 7px;border-radius:10px;display:inline-block;margin-top:3px;font-weight:500}
.shop-price{font-family:'Anton',sans-serif;font-size:15px;color:var(--teal);
  white-space:nowrap;flex-shrink:0}
.shop-total{background:var(--ember-d);border:1px solid rgba(168,85,247,.3);
  border-radius:12px;padding:11px 14px;display:flex;
  justify-content:space-between;align-items:center;margin-top:4px}
.shop-total-lbl{font-size:11px;color:var(--muted)}
.shop-total-val{font-family:'Anton',sans-serif;font-size:18px;color:var(--ember-s)}

/* RULES */
.rule{background:var(--card);border:1px solid var(--bdr);border-radius:20px;
  padding:14px 16px;margin-bottom:8px}
.rule.hi{background:var(--ember);border-color:var(--ember)}
.rule.hi .rule-title,.rule.hi .rule-body{color:#fff}
.rule-icon{font-size:20px;margin-bottom:6px}
.rule-title{font-family:'Anton',sans-serif;font-size:15px;text-transform:uppercase;
  letter-spacing:.03em;margin-bottom:5px}
.rule-body{font-size:13.5px;color:var(--muted);line-height:1.6}
.rule-body b{color:var(--txt);font-weight:500}
.rule.hi .rule-body b{color:#fff}

/* NAV */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:500px;
  background:rgba(7,7,15,.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid rgba(255,255,255,.06);display:flex;z-index:100;
  padding-bottom:env(safe-area-inset-bottom,0);
  overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nb{flex:0 0 auto;min-width:60px;padding:10px 6px 8px;display:flex;
  flex-direction:column;align-items:center;gap:3px;cursor:pointer;
  background:none;border:none;color:var(--faint);font-family:'DM Sans';
  font-size:9px;letter-spacing:.04em;transition:color .2s;
  position:relative;border-radius:0}
.nb.on{color:var(--day)}
.nb.on::before{content:'';position:absolute;top:6px;left:4px;right:4px;bottom:4px;
  border-radius:10px;background:rgba(168,85,247,.12);z-index:-1}
.nb-ic{font-size:20px;line-height:1;transition:transform .2s}
.nb.on .nb-ic{transform:scale(1.1)}

/* NUTRI */
.ncard{background:var(--card);border:1px solid var(--bdr);border-radius:20px;
  padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:border-color .2s}
.ncard:hover{border-color:rgba(168,85,247,.35)}
.ncard-top{display:flex;align-items:center;gap:10px}
.ncard-e{font-size:22px;flex-shrink:0}
.ncard-main{flex:1}
.ncard-name{font-size:14.5px;font-weight:500;line-height:1.2}
.ncard-por{font-size:10px;color:var(--faint);margin-top:2px;font-style:italic}
.ncard-badge{font-size:10px;font-weight:600;color:var(--teal);background:var(--teal-d);
  padding:3px 8px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.ncard-body{display:none;margin-top:10px;padding-top:10px;
  border-top:1px solid var(--bdr)}
.ncard.open .ncard-body{display:block}
.nmacros{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.nm{background:var(--surf);border-radius:8px;padding:7px 5px;
  display:flex;flex-direction:column;align-items:center;gap:2px}
.nm.kc{background:var(--ember-d)}
.nm.kc .nm-v{color:var(--ember-s)}
.nm-v{font-family:'Anton',sans-serif;font-size:15px;color:var(--teal);line-height:1}
.nm-l{font-size:9px;color:var(--faint);text-transform:uppercase;letter-spacing:.04em}
.nvits{margin-top:4px}
.nvit-title{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;
  letter-spacing:.08em;margin-bottom:6px}
.nvit-row{display:flex;justify-content:space-between;align-items:center;
  padding:5px 0;border-bottom:1px solid var(--bdr);font-size:11.5px}
.nvit-row:last-child{border-bottom:none}
.nvit-name{color:var(--muted);flex:1}
.nvit-val{color:var(--txt);font-weight:500;text-align:right;flex-shrink:0;margin-left:8px}
.nvit-vd{font-size:10px;color:var(--teal);margin-left:6px;white-space:nowrap}
.ncard-dest{margin-top:8px;font-size:11.5px;color:var(--teal);
  background:var(--teal-d);border-radius:7px;padding:7px 10px;line-height:1.4}
.ncat-title{font-size:9.5px;font-weight:600;color:var(--ember);
  letter-spacing:.14em;text-transform:uppercase;margin:14px 0 7px;
  padding-left:2px}
.ncat-title:first-child{margin-top:0}

/* EXPORT/IMPORT */
.backup-row{display:flex;gap:8px;margin-bottom:14px}
/* .backup-btn overridden by NOTIF section below */
.backup-btn.export{border-color:rgba(34,211,238,.4);color:var(--teal);background:var(--teal-d)}
.backup-btn.import{border-color:rgba(168,85,247,.4);color:var(--blue);background:var(--blue-d)}
.backup-btn .bb-ic{font-size:18px;display:block;margin-bottom:3px}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
  background:var(--card);border:1px solid var(--teal);color:var(--teal);
  border-radius:10px;padding:10px 18px;font-size:12px;font-weight:500;
  z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;
  white-space:nowrap}
.toast.show{opacity:1}
#fileInput{display:none}

/* HISTORY */
.htabs{display:flex;gap:6px;margin-bottom:16px;background:var(--surf);
  border:1px solid var(--bdr);border-radius:100px;padding:4px}
.htab{flex:1;padding:8px 4px;text-align:center;font-size:11px;font-weight:600;
  letter-spacing:.05em;text-transform:uppercase;border-radius:100px;
  border:none;background:none;color:var(--faint);
  cursor:pointer;transition:all .2s}
.htab.on{background:var(--day);color:#fff}
.hcard{background:var(--card);border:1px solid var(--bdr);border-radius:20px;
  padding:14px 16px;margin-bottom:8px}
.hcard-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.hcard-date{font-family:'Anton',sans-serif;font-size:16px;letter-spacing:.02em}
.hcard-dow{font-size:10px;color:var(--muted);margin-top:1px}
.hcard-badge{margin-left:auto;font-size:10px;font-weight:600;padding:3px 9px;
  border-radius:20px;white-space:nowrap}
.badge-mt{color:var(--ember);background:var(--ember-d)}
.badge-tf{color:var(--blue);background:var(--blue-d)}
.badge-qui{color:var(--blue);background:var(--blue-d)}
.badge-fds{color:var(--green);background:var(--green-d)}
.hpbar-wrap{margin-bottom:8px}
.hpbar-row{display:flex;justify-content:space-between;font-size:11px;
  color:var(--muted);margin-bottom:4px}
.hpbar-earned{font-weight:600;color:var(--txt)}
.hptrack{height:5px;background:var(--bdr);border-radius:3px;overflow:hidden}
.hpfill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--teal),var(--teal-s));transition:width .3s}
.hpfill.full{background:linear-gradient(90deg,var(--ember),var(--ember-s))}
.hmeals{display:flex;flex-wrap:wrap;gap:5px}
.hmeal-chip{font-size:10px;padding:3px 8px;border-radius:20px;
  background:var(--surf);color:var(--faint);border:1px solid var(--bdr)}
.hmeal-chip.done{background:var(--teal-d);color:var(--teal);border-color:rgba(34,211,238,.3)}
.hmeal-chip.skip{background:var(--gold-d);color:var(--gold);border-color:rgba(212,146,42,.3)}
.hempty{text-align:center;padding:32px 16px;color:var(--faint);font-size:13px;line-height:1.6}
.hempty-icon{font-size:32px;display:block;margin-bottom:10px}
.wcard{background:var(--card);border:1px solid rgba(255,255,255,.05);border-radius:16px;
  box-shadow:0 2px 14px rgba(0,0,0,.4);
  padding:14px;margin-bottom:10px}
.wcard-title{font-family:'Anton',sans-serif;font-size:15px;text-transform:uppercase;
  letter-spacing:.04em;margin-bottom:10px}
.wcard-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.wstat{background:var(--surf);border-radius:8px;padding:8px 6px;text-align:center}
.wstat-v{font-family:'Anton',sans-serif;font-size:17px;color:var(--teal);line-height:1}
.wstat-l{font-size:9px;color:var(--faint);text-transform:uppercase;
  letter-spacing:.04em;margin-top:2px}
.wbars{display:flex;gap:4px;align-items:flex-end;height:50px;margin-top:4px}
.wbar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.wbar{width:100%;background:var(--teal-d);border-radius:3px 3px 0 0;
  border:1px solid rgba(34,211,238,.2);transition:height .3s;min-height:3px}
.wbar.today{background:var(--ember-d);border-color:rgba(168,85,247,.3)}
.wbar-lbl{font-size:8px;color:var(--faint);text-transform:uppercase}
.mcard-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.mstat{background:var(--surf);border-radius:10px;padding:12px}
.mstat-v{font-family:'Anton',sans-serif;font-size:22px;color:var(--teal);
  line-height:1;margin-bottom:4px}
.mstat-l{font-size:10px;color:var(--muted);line-height:1.4}
.mstat.hi .mstat-v{color:var(--ember-s)}

/* SKIP */
.mc-skip-btn{margin:0 13px 11px;padding:7px 12px;background:var(--surf);
  border:1px dashed var(--bdr);border-radius:8px;font-size:11.5px;
  color:var(--muted);cursor:pointer;text-align:center;transition:all .18s;
  width:calc(100% - 26px)}
.mc-skip-btn:hover{border-color:var(--gold);color:var(--gold)}
.mc.skipped{border-color:var(--gold);background:rgba(212,146,42,.06)}
.mc.skipped .mc-head{opacity:.5}
.mc.skipped .mc-sum{opacity:.5;text-decoration:line-through}
.skip-replace{padding:10px 13px 12px;border-top:1px solid rgba(212,146,42,.3)}
.skip-title{font-size:11px;font-weight:600;color:var(--gold);
  text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px}
.skip-macros{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.skip-m{background:var(--surf);border-radius:8px;padding:8px 6px;
  display:flex;flex-direction:column;align-items:center;gap:2px}
.skip-m .sm-v{font-family:'Anton',sans-serif;font-size:16px;
  color:var(--gold);line-height:1}
.skip-m .sm-l{font-size:9px;color:var(--faint);text-transform:uppercase;
  letter-spacing:.04em}
.skip-food{font-size:12.5px;color:var(--muted);line-height:1.55;margin-bottom:8px}
.skip-calc{background:var(--gold-d);border-radius:8px;padding:8px 10px;
  font-size:11.5px;color:var(--gold);line-height:1.5}
.skip-calc b{font-weight:600;color:var(--txt)}
.skip-undo{margin-top:8px;font-size:11px;color:var(--faint);
  text-decoration:underline;cursor:pointer;display:block;text-align:center}

/* EDIT */
.mc-edit-btn{margin:8px 13px 3px;padding:8px 12px;background:rgba(168,85,247,.07);
  border:1px dashed rgba(168,85,247,.35);border-radius:8px;font-size:11.5px;
  color:var(--blue);cursor:pointer;text-align:center;transition:all .18s;
  width:calc(100% - 26px);display:block}
.mc-edit-btn:hover{background:rgba(168,85,247,.15)}
.mc.mc-edited{border-color:rgba(168,85,247,.5)}
.sub-badge{font-size:9px;color:var(--blue);background:rgba(168,85,247,.13);
  padding:2px 6px;border-radius:10px;margin-left:5px;font-weight:600;display:inline-block}
.mc-edit-form{display:none;padding:10px 13px 13px;border-top:1px solid rgba(168,85,247,.3)}
.mc.open .mc-edit-form{display:block}
.edit-title{font-size:11px;font-weight:600;color:var(--blue);text-transform:uppercase;
  letter-spacing:.07em;margin-bottom:10px}
.edit-row{margin-bottom:8px}
.edit-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;
  letter-spacing:.05em;margin-bottom:4px}
.edit-input{width:100%;background:var(--surf);border:1px solid var(--bdr);border-radius:7px;
  padding:8px 10px;color:var(--txt);font-family:'DM Sans',sans-serif;font-size:12.5px;
  line-height:1.5;resize:vertical;outline:none;-webkit-appearance:none;box-sizing:border-box}
.edit-input:focus{border-color:var(--blue)}
textarea.edit-input{min-height:70px}
.edit-btns{display:flex;gap:8px;margin-top:10px}
.edit-save{flex:1;padding:9px;background:var(--blue);border:none;border-radius:8px;
  color:#fff;font-family:'DM Sans';font-size:12px;font-weight:600;cursor:pointer}
.edit-cancel{padding:9px 14px;background:var(--surf);border:1px solid var(--bdr);
  border-radius:8px;color:var(--muted);font-family:'DM Sans';font-size:12px;cursor:pointer}
.edit-undo{margin-top:8px;font-size:11px;color:var(--faint);
  text-decoration:underline;cursor:pointer;display:block;text-align:center}

/* SHOP CHECK */
.shop-chk{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--bdr);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:11px;color:transparent;transition:all .18s;cursor:pointer;margin-left:4px}
.mcard.shop-done .shop-chk{background:var(--teal);border-color:var(--teal);color:#fff}
.mcard.shop-done .mcard-name{text-decoration:line-through;color:var(--faint)}
.mcard.shop-done{opacity:.65}

/* MED TRACKER */
.med-card{background:var(--card);border:1px solid var(--bdr);border-radius:20px;
  padding:14px 16px;margin-bottom:10px}
.med-head{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.med-icon{font-size:26px;flex-shrink:0}
.med-info{flex:1;min-width:0}
.med-name{font-size:14px;font-weight:600;color:var(--txt)}
.med-dose{font-size:11px;color:var(--faint);margin-top:2px}
.med-last{font-size:12px;margin-bottom:10px}
.med-last.recent{color:var(--teal)}
.med-last.old{color:var(--muted)}
.med-row{display:flex;align-items:center;gap:10px}
.med-btn{padding:7px 16px;background:var(--ember-d);border:1.5px solid var(--ember);
  border-radius:100px;color:var(--ember-s);font-family:'DM Sans';font-size:11.5px;
  font-weight:600;cursor:pointer;transition:all .18s;-webkit-tap-highlight-color:transparent}
.med-btn.taken{background:var(--teal-d);border-color:var(--teal);color:var(--teal)}
.med-count{font-size:11px;color:var(--faint);margin-left:4px}
.med-week{display:flex;gap:5px;margin-top:10px}
.mwd{width:30px;height:30px;border-radius:50%;background:var(--surf);
  border:1px solid var(--bdr);display:flex;flex-direction:column;align-items:center;
  justify-content:center;flex-shrink:0}
.mwd.on{background:var(--teal-d);border-color:var(--teal)}
.mwd-l{font-size:7.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.03em;line-height:1}
.mwd.on .mwd-l{color:var(--teal)}
.mwd-d{font-size:9px;font-weight:600;color:var(--faint);line-height:1;margin-bottom:1px}
.mwd.on .mwd-d{color:var(--teal)}

/* ESO TIMER */
.eso-timer{background:var(--card);border:1px solid var(--bdr);border-radius:12px;
  padding:13px 14px;margin-bottom:12px;display:flex;gap:12px;align-items:center}
.eso-timer.eso-due{border-color:rgba(168,85,247,.5);background:var(--ember-d)}
.eso-icon{font-size:24px;flex-shrink:0}
.eso-info{flex:1;min-width:0}
.eso-title{font-size:11.5px;font-weight:600;color:var(--txt);margin-bottom:3px}
.eso-status{font-size:13px;font-weight:600;margin-bottom:2px;line-height:1.2}
.eso-dates{font-size:10.5px;color:var(--faint)}
.eso-btn{padding:8px 14px;background:var(--violet);border:none;border-radius:8px;
  color:#fff;font-family:'DM Sans';font-size:12px;font-weight:600;cursor:pointer;
  flex-shrink:0;white-space:nowrap}
.eso-timer.eso-due .eso-btn{background:var(--ember)}

/* ACHIEVEMENTS */
.achievements{display:flex;gap:6px;flex-wrap:wrap}
.ach{display:flex;flex-direction:column;align-items:center;gap:4px;
  flex:0 0 calc(16.6% - 5px);min-width:48px;cursor:default}
.ach-icon{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:20px;border:2px solid var(--bdr);
  background:var(--surf);filter:grayscale(1);opacity:.35;transition:all .3s}
.ach.unlocked .ach-icon{filter:none;opacity:1;border-color:var(--teal);
  background:var(--teal-d);box-shadow:0 0 12px rgba(34,211,238,.25)}
.ach-name{font-size:8.5px;color:var(--faint);text-align:center;line-height:1.3;
  max-width:52px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ach.unlocked .ach-name{color:var(--muted)}

/* WEEK DOTS */
.wdots{display:flex;justify-content:space-between;padding:8px 2px 2px;gap:2px}
.wdot-wrap{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;cursor:default}
.wdot{width:10px;height:10px;border-radius:50%;background:var(--bdr);transition:background .2s}
.wdot.green{background:var(--teal)}
.wdot.orange{background:var(--gold)}
.wdot.red{background:rgba(168,85,247,.4)}
.wdot-wrap.today .wdot{outline:2px solid var(--day);outline-offset:2px}
.wdot-wrap.today .wdot-lbl{color:var(--day);font-weight:700}
.wdot-lbl{font-size:8.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.04em}

/* PROTEIN ALERT */
.prot-alert{background:var(--gold-d);border:1px solid rgba(212,146,42,.35);
  border-radius:10px;padding:10px 13px;font-size:12px;color:var(--gold);
  line-height:1.5;margin-top:8px}
.prot-alert b{font-weight:600;color:var(--txt)}

/* SHARE — overridden by later definition */

/* STREAK */
.streak-badge{font-size:11px;font-weight:600;color:var(--gold);
  letter-spacing:.02em;white-space:nowrap}
.streak-badge b{color:var(--gold)}

/* WATER TRACK */
.water-track{margin-top:10px;background:var(--blue-d);border:1px solid rgba(168,85,247,.25);
  border-radius:8px;padding:8px 12px}
.wt-top{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.wt-lbl{font-size:11.5px;color:var(--blue);font-weight:600;flex:1}
.wt-total{font-size:11px;color:var(--blue);opacity:.8}
.wt-cups{display:flex;gap:5px;flex-wrap:wrap}
.wt-cup{width:30px;height:30px;border-radius:50%;background:rgba(168,85,247,.12);
  border:1.5px solid rgba(168,85,247,.25);cursor:pointer;display:flex;
  align-items:center;justify-content:center;font-size:15px;transition:all .15s;
  opacity:.35;user-select:none}
.wt-cup.on{background:rgba(168,85,247,.3);border-color:var(--blue);opacity:1}
.wt-hint{font-size:9.5px;color:var(--blue);opacity:.6;margin-top:5px;letter-spacing:.03em}

/* DAY NOTE */
.day-note-card{background:var(--card);border:1px solid var(--bdr);border-radius:12px;
  padding:13px 14px;margin-top:8px}
.dn-title{font-family:'Anton',sans-serif;font-size:15px;text-transform:uppercase;
  letter-spacing:.03em;margin-bottom:10px}
.dn-moods{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.dn-mood{padding:6px 11px;border-radius:20px;font-size:11.5px;font-weight:500;
  border:1.5px solid var(--bdr);background:var(--surf);color:var(--muted);
  cursor:pointer;transition:all .15s;white-space:nowrap}
.dn-mood.on{border-color:var(--teal);background:var(--teal-d);color:var(--teal)}
.dn-mood.on.mood-ok{border-color:var(--blue);background:var(--blue-d);color:var(--blue)}
.dn-mood.on.mood-tired{border-color:var(--gold);background:var(--gold-d);color:var(--gold)}
.dn-mood.on.mood-stomach{border-color:var(--violet);background:var(--violet-d);color:var(--violet)}
.dn-note-row{display:flex;gap:8px;align-items:flex-end}
.dn-textarea{flex:1;background:var(--surf);border:1px solid var(--bdr);border-radius:8px;
  padding:8px 10px;color:var(--txt);font-family:'DM Sans';font-size:12px;
  resize:none;outline:none;min-height:52px;line-height:1.5;box-sizing:border-box}
.dn-textarea:focus{border-color:var(--teal)}
.dn-save{padding:8px 14px;background:var(--teal);border:none;border-radius:8px;
  color:#fff;font-family:'DM Sans';font-size:12px;font-weight:600;cursor:pointer;
  white-space:nowrap;flex-shrink:0}

/* WEIGHT TAB */
.wt-entry{display:flex;gap:8px;align-items:center;margin-bottom:14px}
.wt-entry-input{flex:1;background:var(--surf);border:1px solid var(--bdr);border-radius:8px;
  padding:10px 12px;color:var(--txt);font-family:'DM Sans';font-size:17px;
  font-weight:600;outline:none;-webkit-appearance:none;text-align:center;box-sizing:border-box}
.wt-entry-input:focus{border-color:var(--ember)}
.wt-entry-btn{padding:10px 18px;background:var(--ember);border:none;border-radius:8px;
  color:#fff;font-family:'DM Sans';font-size:13px;font-weight:600;cursor:pointer}
.wt-list{display:flex;flex-direction:column;gap:6px}
.wt-item{background:var(--card);border:1px solid var(--bdr);border-radius:10px;
  padding:10px 13px;display:flex;align-items:center;gap:10px}
.wt-item-date{font-size:12px;color:var(--muted);flex:1}
.wt-item-val{font-family:'Anton',sans-serif;font-size:18px;color:var(--ember-s)}
.wt-item-delta{font-size:11px;padding:2px 7px;border-radius:10px;font-weight:600;flex-shrink:0}
.wt-item-delta.up{color:var(--ember);background:var(--ember-d)}
.wt-item-delta.down{color:var(--teal);background:var(--teal-d)}
.wt-item-delta.same{color:var(--muted);background:var(--surf)}
.wt-empty{text-align:center;padding:28px 16px;color:var(--faint);font-size:12.5px;line-height:1.7}

/* NOTIF */
.notif-btn{width:100%;padding:13px;background:var(--surf);border:1.5px solid var(--bdr);
  border-radius:12px;color:var(--muted);font-family:'DM Sans';font-size:13px;
  font-weight:500;cursor:pointer;text-align:center;transition:all .2s;margin-bottom:10px;
  display:block}
.notif-btn.active{border-color:rgba(34,211,238,.4);color:var(--teal);background:var(--teal-d)}
.share-btn{width:100%;padding:13px;background:var(--surf);border:1.5px solid var(--bdr);
  border-radius:12px;color:var(--muted);font-family:'DM Sans';font-size:13px;font-weight:500;
  cursor:pointer;text-align:center;transition:all .2s;margin-top:8px;display:block}
.share-btn:hover,.share-btn:active{border-color:var(--day);color:var(--txt)}
.backup-btn{flex:1;padding:12px 8px;border-radius:12px;border:1.5px solid var(--bdr);
  background:var(--surf);color:var(--muted);font-family:'DM Sans';font-size:12px;
  font-weight:500;cursor:pointer;text-align:center;transition:all .18s;line-height:1.3}
/* BOTTOM SHEET */
.bsheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:150;
  opacity:0;pointer-events:none;transition:opacity .3s}
.bsheet-overlay.show{opacity:1;pointer-events:auto}
.bsheet{position:fixed;bottom:0;left:50%;transform:translate(-50%,100%);
  width:100%;max-width:500px;background:var(--card2);border-radius:20px 20px 0 0;
  z-index:151;transition:transform .35s cubic-bezier(.32,0,.12,1);
  padding-bottom:env(safe-area-inset-bottom,20px);max-height:85vh;overflow-y:auto;
  box-shadow:0 -8px 40px rgba(0,0,0,.6)}
.bsheet.open{transform:translate(-50%,0)}
.bsheet-handle{width:36px;height:4px;background:var(--bdr2);border-radius:2px;
  margin:12px auto 4px}
.bsheet-title{font-family:'Anton',sans-serif;font-size:17px;text-transform:uppercase;
  letter-spacing:.03em;padding:8px 20px 14px;border-bottom:1px solid var(--bdr)}
.bsheet-body{padding:16px 20px 20px}

@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fabPop{from{transform:scale(0.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}

/* SW UPDATE BANNER */
.sw-update-banner{display:none;position:fixed;top:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:500px;background:var(--teal);color:#000;z-index:300;
  padding:12px 18px;font-size:12.5px;font-weight:600;text-align:center;cursor:pointer}
.sw-update-banner.show{display:block}

/* TRAINING TIMER */
.timer-wrap{display:flex;align-items:center;gap:10px;margin-top:10px}
.timer-btn{padding:8px 16px;background:var(--ember-d);border:1.5px solid var(--ember);
  border-radius:20px;color:var(--ember-s);font-family:'DM Sans';font-size:12px;
  font-weight:600;cursor:pointer;transition:all .18s}
.timer-btn.running{background:var(--ember);color:#fff;animation:pulse 1.5s infinite}
.timer-disp{font-family:'Anton',sans-serif;font-size:22px;color:var(--teal);
  letter-spacing:.06em;display:none}
.timer-disp.running{display:block}
.timer-saved{font-size:11px;color:var(--teal);background:var(--teal-d);
  border-radius:10px;padding:3px 10px;font-weight:600}

/* MACRO DONUT */
.macro-donut-wrap{display:flex;align-items:center;gap:14px;padding:10px 14px;
  background:var(--surf);border-radius:14px;margin-top:8px;
  border:1px solid var(--bdr)}
.macro-legend{display:flex;flex-direction:column;gap:5px}
.ml-item{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;color:var(--muted)}
.ml-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}

/* BODY METRICS */
.bio-card{background:var(--card);border:1px solid var(--bdr);border-radius:20px;
  padding:16px;margin-top:14px}
.bio-title{font-family:'Anton',sans-serif;font-size:14px;text-transform:uppercase;
  letter-spacing:.04em;margin-bottom:12px;color:var(--muted)}
.bio-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.bio-stat{background:var(--surf);border-radius:10px;padding:10px 12px}
.bio-stat-v{font-family:'Anton',sans-serif;font-size:22px;line-height:1;margin-bottom:3px}

// ── Week key (resets every Monday) ──────────────
function getWeekKey(){
  const now=new Date();
  const d=new Date(Date.UTC(now.getFullYear(),now.getMonth(),now.getDate()));
  const day=d.getUTCDay()||7;
  d.setUTCDate(d.getUTCDate()+4-day);
  const y=new Date(Date.UTC(d.getUTCFullYear(),0,1));
  const w=Math.ceil((((d-y)/86400000)+1)/7);
  return `plano-${d.getUTCFullYear()}-W${String(w).padStart(2,'0')}`;
}

function getWeekNum(){
  const now=new Date();
  const d=new Date(Date.UTC(now.getFullYear(),now.getMonth(),now.getDate()));
  const day=d.getUTCDay()||7;
  d.setUTCDate(d.getUTCDate()+4-day);
  const y=new Date(Date.UTC(d.getUTCFullYear(),0,1));
  return Math.ceil((((d-y)/86400000)+1)/7);
}

// ── Storage helpers ──────────────────────────────
const STORE_KEY='plano_checked_week';
const STORE_WK='plano_current_week';

function loadState(){
  const savedWk=localStorage.getItem(STORE_WK);
  const currentWk=getWeekKey();
  if(savedWk&&savedWk!==currentWk){
    localStorage.removeItem(STORE_KEY);
    localStorage.removeItem('plano_skipped_'+savedWk);
    localStorage.setItem(STORE_WK,currentWk);
    document.getElementById('resetBanner').classList.add('show');
    return {};
  }
  if(!savedWk) localStorage.setItem(STORE_WK,currentWk);
  // load skip state
  const skipRaw=localStorage.getItem('plano_skipped_'+currentWk);
  if(skipRaw) try{skipped=JSON.parse(skipRaw);}catch(e){}
  const raw=localStorage.getItem(STORE_KEY);
  return raw?JSON.parse(raw):{};
}

function renderNutri(){
  let h='<p class="sec-title">Nutrição</p>';
  h+=`<div class="ibox" style="margin-bottom:14px;font-size:11.5px;line-height:1.6;">
    Toque em qualquer alimento para ver macros + vitaminas + minerais.<br>
    <b>VD</b> = Valor Diário de referência (adulto 2000 kcal).
  </div>`;
  NUTRI_CATS.forEach(cat=>{
    h+=`<div class="ncat-title">${cat.cat}</div>`;
    cat.items.forEach(item=>{
      h+=`<div class="ncard" onclick="this.classList.toggle('open')">
        <div class="ncard-top">
          <span class="ncard-e">${item.e}</span>
          <div class="ncard-main">
            <div class="ncard-name">${item.n}</div>
            <div class="ncard-por">${item.por}</div>
          </div>
          <span class="ncard-badge">${item.badge}</span>
        </div>
        <div class="ncard-body">
          <div class="nmacros">
            <div class="nm"><span class="nm-v">${item.prot}</span><span class="nm-l">Prot</span></div>
            <div class="nm"><span class="nm-v">${item.carb}</span><span class="nm-l">Carbo</span></div>
            <div class="nm"><span class="nm-v">${item.gord}</span><span class="nm-l">Gorд</span></div>
            <div class="nm kc"><span class="nm-v">${item.kcal}</span><span class="nm-l">kcal</span></div>
          </div>
          <div class="nvits">
            <div class="nvit-title">Vitaminas e minerais</div>
            ${item.vits.map(v=>`
              <div class="nvit-row">
                <span class="nvit-name">${v.n}</span>
                <span><span class="nvit-val">${v.v}</span>
                ${v.vd!=='—'?`<span class="nvit-vd">${v.vd} VD</span>`:''}</span>
              </div>`).join('')}
          </div>
          <div class="ncard-dest">💡 ${item.dest}</div>
        </div>
      </div>`;
    });
  });
  return h;
}

let itemSubsData=(()=>{try{return JSON.parse(localStorage.getItem(ITEM_SUBS_KEY)||'{}')}catch(e){return{}}})();
function saveItemSubs(){localStorage.setItem(ITEM_SUBS_KEY,JSON.stringify(itemSubsData));}

window.cycleItemSub=function(mealId,itemIdx,e){

window.openSubPicker=function(mealId,itemIdx,e){
  if(e)e.stopPropagation();
  const meal=PLAN.meals.find(m=>m.id===mealId);
  if(!meal)return;
  let items,subs;
  if(meal.hasOpts){
    const selId=getTodayOpts()[mealId]||meal.opts[0].id;
    const selOpt=meal.opts.find(o=>o.id===selId)||meal.opts[0];
    items=selOpt.items;subs=selOpt.subs||{};
  } else {items=meal.items;subs=meal.subs||{};}
  const food=items[itemIdx];if(!food)return;
  const foodSubs=subs[food.f];if(!foodSubs||!foodSubs.length)return;
  const curSubIdx=(itemSubsData[viewDate]||{})[mealId+'-'+itemIdx]||0;
  const bs=document.getElementById('bsheet');
  bs.dataset.qm=mealId;bs.dataset.qi=itemIdx;
  bs.dataset.qp=food.pPer||0;bs.dataset.qk=food.kcalPer||0;
  document.getElementById('bsheetTitle').textContent=food.f;
  const curQty=food.pPer?getItemQty(mealId,itemIdx,viewDate):1;
  let h='';
  if(food.pPer&&curSubIdx===0){
    h+=`<div class="sub-qty-wrap">
      <div class="sub-qty-row">
        <button class="qty-step-btn" onclick="adjSubQty(-1)">−</button>
        <span class="qty-step-val" id="subQtyVal">${curQty}</span>
        <button class="qty-step-btn" onclick="adjSubQty(1)">+</button>
      </div>
      <div class="qty-preview-txt" id="subQtyPrev">${curQty*food.pPer}g proteína · ${curQty*food.kcalPer} kcal</div>
      <button class="qty-confirm-btn" onclick="saveSubQty()">Confirmar quantidade</button>
    </div>
    <div class="sub-divider">Ou substituir por:</div>`;
  }
  h+='<div class="sub-pick-list">';
  if(curSubIdx>0){
    h+=`<button class="sub-pick-opt" onclick="setSubDirect('${mealId}',${itemIdx},0)">${food.f}<span class="sub-pick-tag">original</span></button>`;
  }
  foodSubs.forEach((s,si)=>{
    h+=`<button class="sub-pick-opt${curSubIdx===si+1?' on':''}" onclick="setSubDirect('${mealId}',${itemIdx},${si+1})">${s}</button>`;
  });
  h+='</div>';

function calcQtyProtDelta(mealId,items,dateStr){
  if(!items)return 0;
  let d=0;
  items.forEach((item,idx)=>{if(item.pPer)d+=(getItemQty(mealId,idx,dateStr)-1)*item.pPer;});
  return d;
}
function calcQtyKcalDelta(mealId,items,dateStr){
  if(!items)return 0;
  let d=0;
  items.forEach((item,idx)=>{if(item.kcalPer)d+=(getItemQty(mealId,idx,dateStr)-1)*item.kcalPer;});
  return d;
}

function updProt(){
  const today=viewDate;
  const todayOpts=getTodayOpts();
  let base=0;
  PLAN.meals.forEach(m=>{
    if(!chk[`${today}-${m.id}`]) return;
    const custom=getCustomMeal(m.id,today);
    if(custom){base+=custom.p||0;return;}
    if(m.hasOpts){
      const selId=todayOpts[m.id]||m.opts[0].id;
      const selOpt=m.opts.find(o=>o.id===selId)||m.opts[0];
      base+=selOpt.p+calcQtyProtDelta(m.id,selOpt.items,today);
    } else { base+=m.p+calcQtyProtDelta(m.id,m.items,today); }
  });
  (snackData[today]||[]).forEach(s=>base+=s.p||0);
  const tot=getGoal();
  const pct=Math.min(100,(base/tot)*100);
  const pvalEl=document.getElementById('pval');
  const ptotEl=document.getElementById('ptot');
  if(pvalEl) pvalEl.textContent=base+'g';
  if(ptotEl) ptotEl.textContent=tot;
  const pfEl=document.getElementById('pfill');
  if(pfEl) pfEl.style.width=pct+'%';
  const ringEl=document.getElementById('ringArc');
  if(ringEl){
    ringEl.style.strokeDashoffset=(251.3*(1-pct/100)).toFixed(2);
    ringEl.style.stroke=pct>=100?'var(--gold)':pct>=85?'var(--teal-s)':'var(--ember)';
  }
}

function renderMealItems(mealId, items, subs, todayItemSubs){
  if(!items||!items.length) return '';
  let h='<div class="meal-items">';
  items.forEach((item,idx)=>{
    const foodSubs=subs?subs[item.f]:null;
    const key=mealId+'-'+idx;
    const curSubIdx=todayItemSubs[key]||0;
    const isSubbed=curSubIdx>0&&foodSubs&&curSubIdx<=foodSubs.length;
    const dispFood=isSubbed?foodSubs[curSubIdx-1]:item.f;
    const hasQtyPick=item.pPer&&!isSubbed;
    const curQty=hasQtyPick?getItemQty(mealId,idx,viewDate):1;
    const qtyDisplay=hasQtyPick
      ?`<span class="mi-qty mi-qty-chip">${curQty} ovo${curQty!==1?'s':''}</span>`
      :`<span class="mi-qty">${item.q}</span>`;
    const foodEl=foodSubs
      ?`<span class="mi-food${isSubbed?' mi-subbed':' mi-has-subs'}" onclick="cycleItemSub('${mealId}',${idx},event)">${dispFood}</span>`
      :`<span class="mi-food">${dispFood}</span>`;
    h+=`<div class="meal-item">
      ${foodEl}
      ${qtyDisplay}
    </div>`;
  });
  h+='</div>';
  return h;
}

  PLAN.meals.forEach(m=>{
    if(!chk[`${today}-${m.id}`]) return;
    const custom=getCustomMeal(m.id,today);

    if(m.hasOpts){

const HIST_KEY='plano_hist_v1';
let histView='day'; // day | week | month

function todayStr(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function loadHistory(){
  try{return JSON.parse(localStorage.getItem(HIST_KEY)||'{}')}catch(e){return{}}
}

function saveToHistory(){
  const hist=loadHistory();
  const today=todayStr();
  const todayOpts=getTodayOpts();
  let earned=0;
  const mealNames=[];
  PLAN.meals.forEach(m=>{
    const isDone=!!chk[`${today}-${m.id}`];
    let p;
    if(m.hasOpts){
      const selId=todayOpts[m.id]||m.opts[0].id;
      const selOpt=m.opts.find(o=>o.id===selId)||m.opts[0];
      p=selOpt.p;
    } else { p=m.p; }
    if(isDone) earned+=p;
    mealNames.push({name:m.n, done:isDone, skip:false});
  });
  const goal=getGoal();
  const doneCount=PLAN.meals.filter(m=>chk[`${today}-${m.id}`]).length;
  hist[today]={
    protein:earned,
    goal:goal,
    done:doneCount,
    total:PLAN.meals.length,
    meals:mealNames,
    ts:new Date().toISOString()
  };
  localStorage.setItem(HIST_KEY,JSON.stringify(hist));
}

function renderHistWeek(hist){
  // Group by ISO week
  const weeks={};
  Object.entries(hist).forEach(([date,e])=>{
    const d=new Date(date+'T12:00:00');
    const day=d.getUTCDay()||7;
    const tmp=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
    tmp.setUTCDate(tmp.getUTCDate()+4-day);
    const y=new Date(Date.UTC(tmp.getUTCFullYear(),0,1));
    const wk=Math.ceil((((tmp-y)/86400000)+1)/7);
    const wkey=`${tmp.getUTCFullYear()}-W${String(wk).padStart(2,'0')}`;
    if(!weeks[wkey])weeks[wkey]=[];
    weeks[wkey].push({date,e});
  });
  const sorted=Object.entries(weeks).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,8);
  if(!sorted.length) return `<div class="hempty"><span class="hempty-icon">📊</span>Sem dados ainda.</div>`;
  return sorted.map(([wk,days])=>{
    const prots=days.map(d=>d.e.protein);
    const avg=Math.round(prots.reduce((a,b)=>a+b,0)/prots.length);
    const maxP=Math.max(...prots,1);
    const trainDays=days.filter(d=>d.e.dayType!=='fds').length;
    const completion=Math.round(days.reduce((a,d)=>a+(d.e.done/d.e.total),0)/days.length*100);
    const bars=days.map(d=>{
      const h=Math.round((d.e.protein/maxP)*40);
      const isToday=d.date===todayStr();
      return `<div class="wbar-wrap">
        <div class="wbar ${isToday?'today':''}" style="height:${h}px"></div>
        <span class="wbar-lbl">${getDOW(d.date)}</span>
      </div>`;
    }).join('');
    return `<div class="wcard">
      <div class="wcard-title">${wk.replace('-W',' · Sem ')}</div>
      <div class="wcard-stats">
        <div class="wstat"><div class="wstat-v">${avg}g</div><div class="wstat-l">Prot. média</div></div>
        <div class="wstat"><div class="wstat-v">${trainDays}</div><div class="wstat-l">Dias treino</div></div>
        <div class="wstat"><div class="wstat-v">${completion}%</div><div class="wstat-l">Conclusão</div></div>
      </div>
      <div class="wbars">${bars}</div>
    </div>`;
  }).join('');
}

function renderHistMonth(hist){
  const now=new Date();
  const curMonth=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const months={};
  Object.entries(hist).forEach(([date,e])=>{
    const m=date.slice(0,7);
    if(!months[m])months[m]=[];
    months[m].push({date,e});
  });
  const sorted=Object.entries(months).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,6);
  if(!sorted.length) return `<div class="hempty"><span class="hempty-icon">📈</span>Sem dados ainda.</div>`;
  const mNames=['','Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  return buildProtHistChart()+sorted.map(([m,days])=>{
    const[y,mo]=m.split('-');
    const prots=days.map(d=>d.e.protein);
    const avg=Math.round(prots.reduce((a,b)=>a+b,0)/prots.length);
    const best=Math.max(...prots);
    const trainDays=days.filter(d=>d.e.dayType!=='fds').length;
    const streak=days.filter(d=>d.e.protein>=130).length;
    const isCur=m===curMonth;
    const wEntries=days.filter(d=>weightData[d.date]).sort((a,b)=>a.date.localeCompare(b.date));
    const avgWt=wEntries.length?(wEntries.reduce((a,d)=>a+weightData[d.date],0)/wEntries.length).toFixed(1):null;
    const wtFirst=wEntries.length?weightData[wEntries[0].date]:null;
    const wtLast=wEntries.length>1?weightData[wEntries[wEntries.length-1].date]:null;
    const wtDelta=wtFirst&&wtLast?parseFloat((wtLast-wtFirst).toFixed(1)):null;
    return `<div class="wcard" style="${isCur?'border-color:var(--ember)':''}">
      <div class="wcard-title" style="${isCur?'color:var(--ember-s)':''}">
        ${mNames[parseInt(mo)]} ${y} ${isCur?'· Atual':''}
      </div>
      <div class="mcard-stats">
        <div class="mstat"><div class="mstat-v">${avg}g</div><div class="mstat-l">Proteína média diária</div></div>
        <div class="mstat hi"><div class="mstat-v">${best}g</div><div class="mstat-l">Melhor dia</div></div>
        <div class="mstat"><div class="mstat-v">${days.length}</div><div class="mstat-l">Dias registrados</div></div>
        <div class="mstat"><div class="mstat-v">${trainDays}</div><div class="mstat-l">Dias de treino</div></div>
        <div class="mstat"><div class="mstat-v">${streak}</div><div class="mstat-l">Dias acima de 130g</div></div>
        <div class="mstat"><div class="mstat-v">${Math.round(days.reduce((a,d)=>a+(d.e.done/d.e.total),0)/days.length*100)}%</div><div class="mstat-l">Taxa de conclusão</div></div>
        ${avgWt?`<div class="mstat"><div class="mstat-v" style="color:var(--ember-s)">${avgWt}kg</div><div class="mstat-l">Peso médio</div></div>`:''}
        ${wtDelta!==null?`<div class="mstat"><div class="mstat-v" style="color:${wtDelta<0?'var(--teal)':wtDelta>0?'var(--ember-s)':'var(--muted)'}">${wtDelta>0?'+':''}${wtDelta}kg</div><div class="mstat-l">Variação no mês</div></div>`:''}
      </div>
    </div>`;
  }).join('');
}

function exportHistory(){
  const hist=loadHistory();
  const data={
    version:1,
    exportedAt:new Date().toISOString(),
    history:hist
  };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  const d=new Date();
  a.download=`plano_historico_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('✅ Histórico exportado com sucesso');
}

  document.getElementById('fileInput').click();

document.getElementById('fileInput').addEventListener('change',function(e){
  const file=e.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      const data=JSON.parse(ev.target.result);
      const incoming=data.history||data;
      if(typeof incoming!=='object')throw new Error('Formato inválido');
      const existing=loadHistory();
      // Merge: incoming + existing, incoming wins on conflict
      const merged={...existing,...incoming};
      localStorage.setItem(HIST_KEY,JSON.stringify(merged));
      showToast(`✅ ${Object.keys(incoming).length} dias importados`);
      if(sec==='hist') document.getElementById('main').innerHTML=renderHistorico();
    }catch(err){
      showToast('❌ Arquivo inválido ou corrompido');
    }
  };
  reader.readAsText(file);
  this.value='';
});

function renderWeightTab(){
  const entries=Object.entries(weightData).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,30);
  const today=todayStr();
  const todayVal=weightData[today]||'';
  let h=`<div class="wt-entry">

    <button class="wt-entry-btn" onclick="saveWeightEntry(event)">Salvar</button>
  </div>`;
  if(!entries.length) return h+`<div class="wt-empty">📊 Nenhum peso registrado ainda.<br><small style="color:var(--faint)">Registre todo dia de manhã em jejum para ver a evolução.</small></div>`;
  const ascending=entries.slice().sort((a,b)=>a[0].localeCompare(b[0]));
  // trend chip
  const trend=getWeightTrend();
  if(trend){
    const tIcon={up:'↑',down:'↓',stable:'→'}[trend.trend];
    const tColor={up:'var(--ember)',down:'var(--teal)',stable:'var(--muted)'}[trend.trend];
    const tLabel={up:'subindo',down:'caindo',stable:'estável'}[trend.trend];
    const sign=trend.diff>0?'+':'';
    h+=`<div style="display:flex;justify-content:flex-end;margin-bottom:8px">
      <span style="font-size:11px;font-weight:600;color:${tColor};background:var(--surf);
        border:1px solid var(--bdr);border-radius:20px;padding:4px 12px">
        ${tIcon} ${sign}${trend.diff}kg nos últimos 7 dias · ${tLabel}
      </span></div>`;
  }
  h+=buildWeightSVG(ascending);
  h+='<div class="wt-list">';
  entries.forEach(([date,val],idx)=>{
    const prev=entries[idx+1];
    let delta='',deltaClass='same';
    if(prev){const d=parseFloat((val-prev[1]).toFixed(1));
      if(d>0){delta='+'+d+'kg';deltaClass='up';}
      else if(d<0){delta=d+'kg';deltaClass='down';}
      else{delta='=';deltaClass='same';}
    }
    h+=`<div class="wt-item">
      <div class="wt-item-date">${getDOW(date)} ${fmtDate(date)}${date===today?' · Hoje':''}</div>
      <span class="wt-item-val">${val} kg</span>
      ${delta?`<span class="wt-item-delta ${deltaClass}">${delta}</span>`:''}
    </div>`;
  });
  return h+'</div>'+renderBioCard();
}

function calcStreak(){
  const hist=loadHistory();
  let streak=0;
  const d=new Date();
  for(let i=0;i<365;i++){
    const ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const e=hist[ds];
    if(!e){if(i===0){d.setDate(d.getDate()-1);continue;}break;}
    if(e.protein<e.goal*0.85) break;
    streak++;
    d.setDate(d.getDate()-1);
  }
  return streak;
}
function updStreak(){
  const s=calcStreak();
  const el=document.getElementById('streakBadge');
  if(!el) return;
  el.style.display=s>0?'':'none';
  const n=document.getElementById('streakNum');
  if(n) n.textContent=s;
}

// ── Macro donut ──────────────────────────────────────────
function buildMacroDonut(){
  const tot=PLAN.kcal;
  const p=getGoal();
  const pK=p*4;
  const gK=Math.round(tot*0.28);
  const cK=Math.max(0,tot-pK-gK);
  const r=32,cx=40,cy=40,circ=2*Math.PI*r;
  const segments=[
    {pct:pK/tot,color:'var(--teal)',label:`${p}g Prot`},
    {pct:cK/tot,color:'var(--blue)',label:`~${Math.round(cK/4)}g Carbo`},
    {pct:gK/tot,color:'var(--gold)',label:`~${Math.round(gK/9)}g Gord`},
  ];
  let offset=0;
  const arcs=segments.map(s=>{
    const dash=(s.pct*circ).toFixed(1);
    const off=(-offset*circ).toFixed(1);
    offset+=s.pct;
    return`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}"
      stroke-width="7" stroke-dasharray="${dash} ${circ.toFixed(1)}"
      stroke-dashoffset="${off}" transform="rotate(-90 ${cx} ${cy})"/>`;
  }).join('');
  const legend=segments.map(s=>
    `<span class="ml-item"><span class="ml-dot" style="background:${s.color}"></span>${s.label}</span>`
  ).join('');
  return`<div class="macro-donut-wrap">
    <svg width="80" height="80" viewBox="0 0 80 80" style="flex-shrink:0">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--bdr)" stroke-width="7"/>
      ${arcs}
      <text x="${cx}" y="${cy+4}" text-anchor="middle" font-size="8" fill="var(--muted)" font-family="DM Sans">${Math.round(tot/1000*10)/10}k kcal</text>
    </svg>
    <div class="macro-legend">${legend}</div>
  </div>`;
}

// ── Protein history chart ─────────────────────────────────
function buildProtHistChart(){
  const hist=loadHistory();
  const sorted=Object.entries(hist).sort((a,b)=>a[0].localeCompare(b[0])).slice(-28);
  if(sorted.length<3) return '';
  const vals=sorted.map(([,e])=>Math.min(100,Math.round(e.protein/e.goal*100)));
  const W=280,H=52,barW=Math.max(4,Math.floor((W-8)/(vals.length+.5)));
  const bars=vals.map((v,i)=>{
    const x=(4+i*(barW+1.5)).toFixed(1);
    const bh=Math.max(2,(v/100*(H-8))).toFixed(1);
    const y=(H-4-parseFloat(bh)).toFixed(1);
    const isToday=sorted[i][0]===todayStr();
    const color=v>=85?'var(--teal)':v>=50?'var(--gold)':'rgba(168,85,247,.5)';
    return`<rect x="${x}" y="${y}" width="${barW}" height="${bh}"
      rx="2" fill="${color}" opacity="${isToday?1:.75}"/>
    ${isToday?`<circle cx="${parseFloat(x)+barW/2}" cy="${parseFloat(y)-4}" r="2.5" fill="var(--day)"/>`:''}`;
  }).join('');
  return`<div class="prot-hist-wrap">
    <div class="prot-hist-title">Proteína · últimos ${vals.length} dias</div>
    <svg width="100%" viewBox="0 0 ${W} ${H}" style="display:block;overflow:visible">
      ${bars}
      <line x1="0" y1="${H-4}" x2="${W}" y2="${H-4}" stroke="var(--bdr)" stroke-width="1"/>
      <line x1="0" y1="${(H-4-(85/100*(H-8))).toFixed(1)}" x2="${W}" y2="${(H-4-(85/100*(H-8))).toFixed(1)}"
        stroke="var(--teal)" stroke-width="1" stroke-dasharray="3 3" opacity=".4"/>
    </svg>
    <div style="font-size:9px;color:var(--faint);text-align:right;margin-top:2px">linha tracejada = meta 85%</div>
  </div>`;
}

// ── Weight trend ─────────────────────────────────────────
function getWeightTrend(){
  const sorted=Object.entries(weightData).sort((a,b)=>a[0].localeCompare(b[0])).slice(-7);
  if(sorted.length<3) return null;
  const first=sorted[0][1],last=sorted[sorted.length-1][1];
  const diff=parseFloat((last-first).toFixed(1));
  return{diff,trend:diff>0.3?'up':diff<-0.3?'down':'stable'};
}

// ── Weight SVG chart ────────────────────────────────────
function buildWeightSVG(entries){
  if(entries.length<2) return '';
  const W=280,H=68,PX=6,PY=16;
  const vals=entries.map(e=>e[1]);
  const minV=Math.min(...vals),maxV=Math.max(...vals);
  const range=(maxV-minV)||0.5;
  const fx=(i)=>PX+i/(entries.length-1)*(W-PX*2);
  const fy=(v)=>PY+(1-(v-minV)/range)*(H-PY*2);
  const pts=entries.map((_,i)=>fx(i).toFixed(1)+','+fy(vals[i]).toFixed(1)).join(' ');
  const area=entries.map((_,i)=>fx(i).toFixed(1)+','+fy(vals[i]).toFixed(1)).join(' ')
    +' '+fx(entries.length-1).toFixed(1)+','+H+' '+fx(0).toFixed(1)+','+H;
  const minIdx=vals.indexOf(minV),maxIdx=vals.indexOf(maxV);
  const special=[...new Set([0,entries.length-1,minIdx,maxIdx])];
  const dots=special.map(i=>{
    const cx=fx(i).toFixed(1),cy=fy(vals[i]).toFixed(1);
    const anch=i===0?'start':i===entries.length-1?'end':'middle';
    const ty=(vals[i]===minV?parseFloat(cy)+12:parseFloat(cy)-5).toFixed(1);
    return`<circle cx="${cx}" cy="${cy}" r="3.5" fill="var(--ember)"/>
      <text x="${cx}" y="${ty}" text-anchor="${anch}" font-size="9" fill="var(--ember-s)" font-family="Anton,sans-serif">${vals[i]}</text>`;
  }).join('');
  return`<div style="padding:2px 0 6px;overflow:hidden"><svg width="100%" viewBox="0 0 ${W} ${H}" style="overflow:visible;display:block">
    <defs><linearGradient id="wgrd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--ember)" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="var(--ember)" stop-opacity="0"/>
    </linearGradient></defs>
    <polygon points="${area}" fill="url(#wgrd)"/>
    <polyline points="${pts}" fill="none" stroke="var(--ember)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}
  </svg></div>`;
}

// ── Kcal bar ─────────────────────────────────────────────
function updKcal(){
  const today=viewDate;const todayOpts=getTodayOpts();
  let earned=0;
  PLAN.meals.forEach(m=>{
    if(!chk[`${today}-${m.id}`]) return;
    const custom=getCustomMeal(m.id,today);
    let mp=custom?custom.p:0;
    if(!custom){
      if(m.hasOpts){
        const selId=todayOpts[m.id]||m.opts[0].id;
        const selOpt=m.opts.find(o=>o.id===selId)||m.opts[0];
        mp=selOpt.p;
        earned+=Math.round(mp*(PLAN.kcal/PLAN.tot))+calcQtyKcalDelta(m.id,selOpt.items,today);
      } else {
        mp=m.p;
        earned+=Math.round(mp*(PLAN.kcal/PLAN.tot))+calcQtyKcalDelta(m.id,m.items,today);
      }
    } else {
      earned+=Math.round(mp*(PLAN.kcal/PLAN.tot));
    }
  });
  (snackData[today]||[]).forEach(s=>earned+=s.k||0);
  const tot=PLAN.kcal;
  const diff=earned-tot;
  const chip=document.getElementById('kcalChip');
  if(chip){
    if(earned===0){chip.textContent='— kcal';chip.className='kcal-chip';}
    else if(diff>50){chip.textContent='+'+diff+' kcal surplus';chip.className='kcal-chip surplus';}
    else if(diff<-50){chip.textContent=diff+' kcal déficit';chip.className='kcal-chip deficit';}
    else{chip.textContent=earned+' kcal / '+tot;chip.className='kcal-chip';}
  }
}

// ── Esomeprazol timer render ─────────────────────────────
function renderEsoTimer(){
  const next=getNextEsoDate();
  const today=todayStr();
  let status,color,btnTxt='Tomei agora';
  if(!esoData.last){status='Nenhum registro · toque Tomei para iniciar';color='var(--violet)';}
  else if(today>=(next||'')&&today===next){status='Hoje é dia de tomar!';color='var(--ember)';}
  else if(next&&today>next){
    const days=Math.round((new Date(today+'T12:00:00')-new Date(next+'T12:00:00'))/86400000);
    status=`⚠️ Atrasado ${days} dia${days>1?'s':''}`;color='var(--ember)';
  } else {
    const days=next?Math.round((new Date(next+'T12:00:00')-new Date(today+'T12:00:00'))/86400000):0;
    status=days===0?'Hoje é dia de tomar!':`Próxima em ${days} dia${days>1?'s':''}`;
    color=days===0?'var(--ember)':'var(--teal)';
  }
  const lastStr=esoData.last?`Última: ${getDOW(esoData.last)} ${fmtDate(esoData.last)}`:'Nenhuma registrada';
  const nextStr=next?`Próxima: ${getDOW(next)} ${fmtDate(next)}`:'—';
  const due=isEsoDue();
  return`<div class="eso-timer ${due?'eso-due':''}">
    <div class="eso-icon">💊</div>
    <div class="eso-info">
      <div class="eso-title">Esomeprazol 20mg · a cada 3 dias</div>
      <div class="eso-status" style="color:${color}">${status}</div>
      <div class="eso-dates">${lastStr}&nbsp;·&nbsp;${nextStr}</div>

  </div>`;
}
