<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Plano Semanal · Muay Thai + Força</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F2682C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plano">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://accounts.google.com/gsi/client" async defer onload="gdriveInit()"></script>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F0C0A;--surf:#181310;--card:#201A16;--bdr:#2C2420;
  --ember:#F2682C;--ember-s:#FF8B5C;--ember-d:rgba(242,104,44,.13);
  --teal:#3DBF8C;--teal-d:rgba(61,191,140,.13);
  --gold:#D4922A;--gold-d:rgba(212,146,42,.13);
  --blue:#4A8CF7;--blue-d:rgba(74,140,247,.13);
  --green:#4DAA73;--green-d:rgba(77,170,115,.13);
  --violet:#9B5ED4;--violet-d:rgba(155,94,212,.13);
  --txt:#F0E8DF;--muted:#9A8F86;--faint:#4E4742;
  --day:#F2682C;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
  font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased}
#app{display:flex;flex-direction:column;height:100%;max-width:500px;
  margin:0 auto;position:relative;overflow:hidden}

/* HEADER */
.hdr{padding:14px 18px 10px;flex-shrink:0;background:linear-gradient(var(--surf),transparent)}
.hdr-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.hdr-title{font-family:'Anton',sans-serif;font-size:20px;letter-spacing:.02em;
  text-transform:uppercase;flex:1}
.week-badge{font-size:10px;color:var(--muted);background:var(--surf);
  border:1px solid var(--bdr);border-radius:6px;padding:4px 9px;
  letter-spacing:.04em;white-space:nowrap}
.week-badge b{color:var(--teal);font-weight:600}
.pills{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
.pills::-webkit-scrollbar{display:none}
.pill{flex-shrink:0;padding:7px 13px;border-radius:20px;font-size:11px;
  font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  border:1.5px solid var(--bdr);background:var(--surf);color:var(--muted);
  cursor:pointer;transition:all .18s}
.pill.on{background:var(--day);border-color:var(--day);color:#fff}

/* PROGRESS */
.pbar-wrap{margin-top:10px;background:var(--surf);border-radius:10px;padding:10px 14px}
.pbar-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.pbar-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.pbar-val{font-family:'Anton',sans-serif;font-size:15px}
.pbar-val small{font-family:'DM Sans';font-size:10px;color:var(--muted);margin-left:2px}
.ptrack{height:4px;background:var(--bdr);border-radius:3px;overflow:hidden}
.pfill{height:100%;background:var(--teal);border-radius:3px;
  transition:width .35s cubic-bezier(.4,0,.2,1);width:0}
.water{margin-top:8px;background:var(--blue-d);border:1px solid rgba(74,140,247,.25);
  border-radius:8px;padding:7px 12px;font-size:11.5px;color:var(--blue);
  display:flex;gap:8px;align-items:center}
.water b{font-weight:600}

/* RESET BANNER (hidden by default) */
.reset-banner{display:none;margin-top:8px;background:var(--teal-d);
  border:1px solid rgba(61,191,140,.35);border-radius:8px;
  padding:8px 12px;font-size:11.5px;color:var(--teal);
  justify-content:space-between;align-items:center;gap:10px}
.reset-banner.show{display:flex}
.reset-banner b{font-weight:600}
.reset-btn{font-size:11px;font-weight:600;color:var(--teal);background:var(--teal-d);
  border:1px solid rgba(61,191,140,.4);border-radius:6px;
  padding:4px 10px;cursor:pointer;white-space:nowrap}

/* MAIN */
main{flex:1;overflow-y:auto;padding:12px 18px 82px;
  scrollbar-width:thin;scrollbar-color:var(--bdr) transparent}
main::-webkit-scrollbar{width:3px}
main::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:2px}
.sec{display:none}.sec.on{display:block}
.sec-title{font-family:'Anton',sans-serif;font-size:19px;text-transform:uppercase;
  letter-spacing:.03em;margin-bottom:14px}

/* TIMELINE */
.tl{position:relative;padding-left:52px}
.tl::before{content:'';position:absolute;left:17px;top:10px;bottom:10px;
  width:1.5px;background:linear-gradient(var(--day),var(--faint))}
.tl-row{position:relative;margin-bottom:9px;
  animation:rise .35s ease both}
.tl-row:nth-child(1){animation-delay:.03s}.tl-row:nth-child(2){animation-delay:.08s}
.tl-row:nth-child(3){animation-delay:.13s}.tl-row:nth-child(4){animation-delay:.18s}
.tl-row:nth-child(5){animation-delay:.23s}.tl-row:nth-child(6){animation-delay:.28s}
.tl-row:nth-child(7){animation-delay:.33s}
.tl-row::before{content:'';position:absolute;left:-38px;top:17px;
  width:11px;height:11px;border-radius:50%;background:var(--bg);
  border:2px solid var(--day);box-shadow:0 0 0 3px var(--bg)}
.mc{background:var(--card);border:1px solid var(--bdr);border-radius:12px;
  overflow:hidden;transition:border-color .18s;cursor:pointer}
.mc:hover{border-color:var(--day)}
.mc.done{opacity:.5;border-color:var(--teal)}
.mc-head{display:flex;align-items:center;gap:8px;padding:11px 13px}
.mc-time{font-size:9.5px;font-weight:600;letter-spacing:.06em;color:var(--day);
  background:var(--ember-d);padding:3px 8px;border-radius:5px;
  white-space:nowrap;flex-shrink:0}
.mc-name{font-size:13.5px;font-weight:500;flex:1;line-height:1.2}
.mc-prot{font-size:10px;font-weight:600;color:var(--teal);background:var(--teal-d);
  padding:3px 8px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.mc-chk{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--bdr);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  font-size:10px;transition:all .18s;color:transparent}
.mc.done .mc-chk{background:var(--teal);border-color:var(--teal);color:#fff}
.mc-sum{font-size:11px;color:var(--faint);padding:0 13px 9px;
  line-height:1.4;margin-top:-4px}
.mc.done .mc-sum{color:var(--faint)}
.mc-body{display:none;padding:0 13px 11px;border-top:1px solid var(--bdr);padding-top:10px}
.mc.open .mc-body{display:block}
.mc.open .mc-sum{display:none}
.mc-food{font-size:12.5px;color:var(--muted);line-height:1.55;font-weight:300}
.mc-supp{margin-top:8px;font-size:11.5px;color:var(--faint);font-style:italic;
  padding-top:8px;border-top:1px solid var(--bdr)}
.mc-supp::before{content:'+ ';color:var(--teal)}
.mc-warn{margin-top:8px;font-size:11.5px;color:var(--gold);
  background:var(--gold-d);padding:7px 10px;border-radius:7px;line-height:1.4}
.mc-gastro{margin-top:8px;font-size:11px;color:var(--violet);
  background:var(--violet-d);padding:7px 10px;border-radius:7px;line-height:1.4}
.tn{background:var(--surf);border:1px solid var(--day);border-radius:12px;
  padding:10px 13px;display:flex;align-items:center;gap:12px;margin-bottom:9px;
  animation:rise .35s ease .23s both}
.tn-dot{width:10px;height:10px;border-radius:50%;background:var(--day);
  flex-shrink:0;box-shadow:0 0 10px var(--day)}
.tn-time{font-size:9px;font-weight:600;color:var(--day);letter-spacing:.06em;text-transform:uppercase}
.tn-name{font-family:'Anton',sans-serif;font-size:15px;text-transform:uppercase;letter-spacing:.04em}
.tn-desc{font-size:11px;color:var(--muted);margin-top:2px}
.total{background:var(--ember-d);border:1px solid rgba(242,104,44,.3);
  border-radius:12px;padding:11px 14px;display:flex;
  justify-content:space-between;align-items:center;margin-top:6px}
.total-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.total-val{font-family:'Anton',sans-serif;font-size:20px;color:var(--ember-s)}
.ibox{background:var(--card);border:1px dashed var(--bdr);border-radius:10px;
  padding:10px 13px;font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:8px}

/* SUPPS */
.supp-card{background:var(--card);border:1px solid var(--bdr);border-radius:12px;
  padding:12px 14px;margin-bottom:8px;display:grid;
  grid-template-columns:1fr auto;gap:3px 12px}
.supp-when{font-size:9.5px;font-weight:600;color:var(--ember);
  letter-spacing:.06em;text-transform:uppercase}
.supp-dose{font-family:'Anton',sans-serif;font-size:17px;color:var(--ember-s);
  grid-row:1/3;grid-column:2;align-self:center;text-align:right;line-height:1.2}
.supp-name{font-size:13.5px;font-weight:500}
.supp-note{font-size:11.5px;color:var(--muted);line-height:1.45;margin-top:3px;grid-column:1}
.supp-card.gc{background:var(--violet-d);border-color:rgba(155,94,212,.3)}
.supp-card.gc .supp-when{color:var(--violet)}
.supp-card.gc .supp-dose{color:var(--violet)}

/* PREP */
.prep-card{background:var(--card);border:1px solid var(--bdr);border-radius:12px;
  padding:15px;margin-bottom:10px}
.prep-hed{font-family:'Anton',sans-serif;font-size:16px;text-transform:uppercase;
  letter-spacing:.03em;margin-bottom:10px}
.prep-step{display:flex;gap:9px;margin-bottom:8px;font-size:12.5px;
  color:var(--muted);line-height:1.5}
.prep-n{width:21px;height:21px;border-radius:50%;background:var(--ember-d);
  color:var(--ember);font-size:10px;font-weight:600;display:flex;
  align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.prep-tip{margin-top:10px;padding:9px 11px;border-radius:8px;font-size:11.5px;line-height:1.5}
.prep-tip.green{background:var(--teal-d);color:var(--teal)}
.prep-tip.gold{background:var(--gold-d);color:var(--gold)}

/* GASTRITE */
.gbox{background:var(--violet-d);border:1px solid rgba(155,94,212,.3);
  border-radius:12px;padding:12px 14px;margin-bottom:8px;
  display:flex;gap:10px;align-items:flex-start}
.gbox-icon{font-size:18px;flex-shrink:0;margin-top:1px}
.gbox-title{font-size:13px;font-weight:600;color:var(--violet);margin-bottom:3px}
.gbox-body{font-size:11.5px;color:var(--muted);line-height:1.45}

/* MONTHLY SHOPPING */
.mcard{background:var(--card);border:1px solid var(--bdr);border-radius:12px;
  padding:11px 13px;margin-bottom:7px;cursor:pointer;transition:border-color .18s}
.mcard:hover{border-color:var(--day)}
.mcard-top{display:flex;align-items:center;gap:10px}
.mcard-e{font-size:20px;flex-shrink:0}
.mcard-info{flex:1;min-width:0}
.mcard-name{font-size:13px;font-weight:500;margin-bottom:1px}
.mcard-tip{font-size:10.5px;color:var(--faint);font-style:italic}
.mcard-qty{font-family:'Anton',sans-serif;font-size:13px;color:var(--teal);
  white-space:nowrap;flex-shrink:0;text-align:right;line-height:1.2}
.mcard-macros{display:none;margin-top:10px;padding-top:10px;
  border-top:1px solid var(--bdr)}
.mcard.open .mcard-macros{display:block}
.mcard-por{font-size:10px;color:var(--faint);text-transform:uppercase;
  letter-spacing:.06em;margin-bottom:7px}
.mcard-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mcard-m{background:var(--surf);border-radius:8px;padding:7px 6px;
  display:flex;flex-direction:column;align-items:center;gap:2px}
.mcard-m.kcal{background:var(--ember-d)}
.mcard-m.kcal .mm-val{color:var(--ember-s)}
.mm-val{font-family:'Anton',sans-serif;font-size:15px;color:var(--teal);line-height:1}
.mm-lbl{font-size:9px;color:var(--faint);text-transform:uppercase;letter-spacing:.04em}

/* SHOP */
.shop-cat{font-size:9.5px;font-weight:600;color:var(--ember);
  letter-spacing:.14em;text-transform:uppercase;margin:14px 0 7px;padding-left:2px}
.shop-cat:first-child{margin-top:0}
.shop-row{background:var(--card);border:1px solid var(--bdr);border-radius:12px;
  padding:11px 13px;margin-bottom:7px;display:flex;gap:11px;align-items:flex-start}
.shop-emoji{font-size:21px;flex-shrink:0;margin-top:2px}
.shop-info{flex:1;min-width:0}
.shop-name{font-size:13px;font-weight:500;margin-bottom:2px}
.shop-body{font-size:11.5px;color:var(--muted);line-height:1.4;margin-bottom:3px}
.shop-where{font-size:10.5px;color:var(--faint);font-style:italic}
.shop-tag{font-size:9.5px;color:var(--teal);background:var(--teal-d);
  padding:2px 7px;border-radius:10px;display:inline-block;margin-top:3px;font-weight:500}
.shop-price{font-family:'Anton',sans-serif;font-size:15px;color:var(--teal);
  white-space:nowrap;flex-shrink:0}
.shop-total{background:var(--ember-d);border:1px solid rgba(242,104,44,.3);
  border-radius:12px;padding:11px 14px;display:flex;
  justify-content:space-between;align-items:center;margin-top:4px}
.shop-total-lbl{font-size:11px;color:var(--muted)}
.shop-total-val{font-family:'Anton',sans-serif;font-size:18px;color:var(--ember-s)}

/* RULES */
.rule{background:var(--card);border:1px solid var(--bdr);border-radius:12px;
  padding:13px 14px;margin-bottom:8px}
.rule.hi{background:var(--ember);border-color:var(--ember)}
.rule.hi .rule-title,.rule.hi .rule-body{color:#fff}
.rule-icon{font-size:20px;margin-bottom:6px}
.rule-title{font-family:'Anton',sans-serif;font-size:15px;text-transform:uppercase;
  letter-spacing:.03em;margin-bottom:5px}
.rule-body{font-size:12.5px;color:var(--muted);line-height:1.55}
.rule-body b{color:var(--txt);font-weight:500}
.rule.hi .rule-body b{color:#fff}

/* NAV */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:500px;background:var(--surf);
  border-top:1px solid var(--bdr);display:flex;z-index:100;
  padding-bottom:env(safe-area-inset-bottom,0);
  overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nb{flex:0 0 auto;min-width:60px;padding:9px 6px;display:flex;
  flex-direction:column;align-items:center;gap:3px;cursor:pointer;
  background:none;border:none;color:var(--faint);font-family:'DM Sans';
  font-size:9.5px;letter-spacing:.03em;transition:color .15s}
.nb.on{color:var(--day)}
.nb-ic{font-size:19px;line-height:1}

/* NUTRI */
.ncard{background:var(--card);border:1px solid var(--bdr);border-radius:12px;
  padding:12px 13px;margin-bottom:8px;cursor:pointer;transition:border-color .18s}
.ncard:hover{border-color:var(--day)}
.ncard-top{display:flex;align-items:center;gap:10px}
.ncard-e{font-size:22px;flex-shrink:0}
.ncard-main{flex:1}
.ncard-name{font-size:13.5px;font-weight:500;line-height:1.2}
.ncard-por{font-size:10px;color:var(--faint);margin-top:2px;font-style:italic}
.ncard-badge{font-size:10px;font-weight:600;color:var(--teal);background:var(--teal-d);
  padding:3px 8px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.ncard-body{display:none;margin-top:10px;padding-top:10px;
  border-top:1px solid var(--bdr)}
.ncard.open .ncard-body{display:block}
.nmacros{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.nm{background:var(--surf);border-radius:8px;padding:7px 5px;
  display:flex;flex-direction:column;align-items:center;gap:2px}
.nm.kc{background:var(--ember-d)}
.nm.kc .nm-v{color:var(--ember-s)}
.nm-v{font-family:'Anton',sans-serif;font-size:15px;color:var(--teal);line-height:1}
.nm-l{font-size:9px;color:var(--faint);text-transform:uppercase;letter-spacing:.04em}
.nvits{margin-top:4px}
.nvit-title{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;
  letter-spacing:.08em;margin-bottom:6px}
.nvit-row{display:flex;justify-content:space-between;align-items:center;
  padding:5px 0;border-bottom:1px solid var(--bdr);font-size:11.5px}
.nvit-row:last-child{border-bottom:none}
.nvit-name{color:var(--muted);flex:1}
.nvit-val{color:var(--txt);font-weight:500;text-align:right;flex-shrink:0;margin-left:8px}
.nvit-vd{font-size:10px;color:var(--teal);margin-left:6px;white-space:nowrap}
.ncard-dest{margin-top:8px;font-size:11.5px;color:var(--teal);
  background:var(--teal-d);border-radius:7px;padding:7px 10px;line-height:1.4}
.ncat-title{font-size:9.5px;font-weight:600;color:var(--ember);
  letter-spacing:.14em;text-transform:uppercase;margin:14px 0 7px;
  padding-left:2px}
.ncat-title:first-child{margin-top:0}

/* EXPORT/IMPORT */
.backup-row{display:flex;gap:8px;margin-bottom:14px}
.backup-btn{flex:1;padding:10px 8px;border-radius:10px;border:1.5px solid var(--bdr);
  background:var(--surf);color:var(--muted);font-family:'DM Sans';font-size:11.5px;
  font-weight:500;cursor:pointer;text-align:center;transition:all .18s;line-height:1.3}
.backup-btn:hover{border-color:var(--day);color:var(--txt)}
.backup-btn.export{border-color:rgba(61,191,140,.4);color:var(--teal);
  background:var(--teal-d)}
.backup-btn.import{border-color:rgba(74,140,247,.4);color:var(--blue);
  background:var(--blue-d)}
.backup-btn .bb-ic{font-size:18px;display:block;margin-bottom:3px}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
  background:var(--card);border:1px solid var(--teal);color:var(--teal);
  border-radius:10px;padding:10px 18px;font-size:12px;font-weight:500;
  z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;
  white-space:nowrap}
.toast.show{opacity:1}
#fileInput{display:none}

/* HISTORY */
.htabs{display:flex;gap:6px;margin-bottom:14px}
.htab{flex:1;padding:8px 4px;text-align:center;font-size:11px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;border-radius:8px;
  border:1.5px solid var(--bdr);background:var(--surf);color:var(--muted);
  cursor:pointer;transition:all .18s}
.htab.on{background:var(--day);border-color:var(--day);color:#fff}
.hcard{background:var(--card);border:1px solid var(--bdr);border-radius:12px;
  padding:12px 14px;margin-bottom:8px}
.hcard-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.hcard-date{font-family:'Anton',sans-serif;font-size:16px;letter-spacing:.02em}
.hcard-dow{font-size:10px;color:var(--muted);margin-top:1px}
.hcard-badge{margin-left:auto;font-size:10px;font-weight:600;padding:3px 9px;
  border-radius:20px;white-space:nowrap}
.badge-mt{color:var(--ember);background:var(--ember-d)}
.badge-tf{color:var(--blue);background:var(--blue-d)}
.badge-qui{color:var(--blue);background:var(--blue-d)}
.badge-fds{color:var(--green);background:var(--green-d)}
.hpbar-wrap{margin-bottom:8px}
.hpbar-row{display:flex;justify-content:space-between;font-size:11px;
  color:var(--muted);margin-bottom:4px}
.hpbar-earned{font-weight:600;color:var(--txt)}
.hptrack{height:5px;background:var(--bdr);border-radius:3px;overflow:hidden}
.hpfill{height:100%;border-radius:3px;background:var(--teal)}
.hpfill.full{background:var(--ember)}
.hmeals{display:flex;flex-wrap:wrap;gap:5px}
.hmeal-chip{font-size:10px;padding:3px 8px;border-radius:20px;
  background:var(--surf);color:var(--faint);border:1px solid var(--bdr)}
.hmeal-chip.done{background:var(--teal-d);color:var(--teal);border-color:rgba(61,191,140,.3)}
.hmeal-chip.skip{background:var(--gold-d);color:var(--gold);border-color:rgba(212,146,42,.3)}
.hempty{text-align:center;padding:32px 16px;color:var(--faint);font-size:13px;line-height:1.6}
.hempty-icon{font-size:32px;display:block;margin-bottom:10px}
.wcard{background:var(--card);border:1px solid var(--bdr);border-radius:12px;
  padding:14px;margin-bottom:10px}

.skip-m{background:var(--surf);border-radius:8px;padding:8px 6px;

.skip-m .sm-v{font-family:'Anton',sans-serif;font-size:16px;

.skip-m .sm-l{font-size:9px;color:var(--faint);text-transform:uppercase;

.skip-food{font-size:12.5px;color:var(--muted);line-height:1.55;margin-bottom:8px}
.skip-calc{background:var(--gold-d);border-radius:8px;padding:8px 10px;

// ── Week key (resets every Monday) ──────────────
function getWeekKey(){
  const now=new Date();
  const d=new Date(Date.UTC(now.getFullYear(),now.getMonth(),now.getDate()));
  const day=d.getUTCDay()||7;
  d.setUTCDate(d.getUTCDate()+4-day);
  const y=new Date(Date.UTC(d.getUTCFullYear(),0,1));
  const w=Math.ceil((((d-y)/86400000)+1)/7);
  return `plano-${d.getUTCFullYear()}-W${String(w).padStart(2,'0')}`;
}

function getWeekNum(){
  const now=new Date();
  const d=new Date(Date.UTC(now.getFullYear(),now.getMonth(),now.getDate()));
  const day=d.getUTCDay()||7;
  d.setUTCDate(d.getUTCDate()+4-day);
  const y=new Date(Date.UTC(d.getUTCFullYear(),0,1));
  return Math.ceil((((d-y)/86400000)+1)/7);
}

const STORE_WK='plano_current_week';

function loadState(){

  if(skipRaw) try{skipped=JSON.parse(skipRaw);}catch(e){}
  const raw=localStorage.getItem(STORE_KEY);
  return raw?JSON.parse(raw):{};
}

function updProt(){
  const d=DAYS[day];
  let base=0;
  d.meals.forEach((m,i)=>{
    if(!m.p)return;
    const isSkip=m.skipable&&skipped[`${day}-skip-${i}`];
    if(isSkip){base+=m.skipProt;}
    else if(chk[`${day}-${i}`]){base+=m.p;}
  });
  // show total possible for this day config
  const tot=d.meals.reduce((a,m,i)=>{
    if(!m.p)return a;
    return a+(m.skipable&&skipped[`${day}-skip-${i}`]?m.skipProt:m.p);
  },0);
  const pct=Math.min(100,(base/tot)*100);
  document.getElementById('pval').innerHTML=
    `${base} g <small>/ <span id="ptot">${tot}</span> g</small>`;
  document.getElementById('pfill').style.width=pct+'%';
}

function renderMeals(){
  const d=DAYS[day];
  let h='<div class="tl">';
  d.meals.forEach((m,i)=>{
    if(m.type==='train'){
      h+=`<div class="tn" style="margin-left:-52px">
        <div class="tn-dot"></div>
        <div><div class="tn-time">${m.t}</div>
        <div class="tn-name">${m.n}</div>
        <div class="tn-desc">${m.d}</div></div></div>`;
    } else {
      const done=chk[`${day}-${i}`]?'done':'';
      const isSkipped=m.skipable&&skipped[`${day}-skip-${i}`];
      // calc missing prot if skipped
      let skipCalc='';
      if(m.skipable&&isSkipped){
        const eaten=DAYS[day].meals.reduce((acc,mx,ix)=>{
          if(!mx.p)return acc;
          if(ix===i)return acc;
          return acc+(chk[`${day}-${ix}`]?mx.p:mx.p);
        },0)-m.p;
        const goal=DAYS[day].tot;
        const have=DAYS[day].meals.reduce((a,mx)=>a+(mx.p&&mx!==m?mx.p:0),0);
        const missing=goal-have;
        skipCalc=`
          <div class="skip-calc">
            Sem jantar você fica com <b>~${have}g</b> de proteína.<br>
            Faltam <b>${missing}g</b> para a meta de ${goal}g.<br>
            ✅ <b>${m.skipScoops}</b> do Soldiers Elite = ~${m.skipProt}g → fecha em <b>~${have+m.skipProt}g</b>.
          </div>`;
      }
      h+=`<div class="tl-row"><div class="mc ${done} ${isSkipped?'skipped':''}" data-i="${i}">
        <div class="mc-head">
          <span class="mc-time">${m.t}</span>
          <span class="mc-name">${m.n}</span>
          <span class="mc-prot">${isSkipped?`+${m.skipProt}g whey`:`+${m.p} g`}</span>
          <div class="mc-chk">${chk[`${day}-${i}`]?'✓':''}</div>
        </div>
        ${m.sum?`<div class="mc-sum">${isSkipped?'<s>'+m.sum+'</s>':m.sum}</div>`:''}
        ${isSkipped?`
        <div class="skip-replace">
          <div class="skip-title">🚫 Sem jantar · compensação via whey</div>
          <div class="skip-macros">
            <div class="skip-m"><span class="sm-v">${m.skipScoops.split(' ')[0]}</span><span class="sm-l">Scoops</span></div>
            <div class="skip-m"><span class="sm-v">37g</span><span class="sm-l">De pó</span></div>
            <div class="skip-m"><span class="sm-v">${m.skipProt}g</span><span class="sm-l">Proteína</span></div>
          </div>
          <div class="skip-food">Soldiers Elite Whey + água · pode adicionar 1 banana para repor energia se quiser.</div>
          ${skipCalc}
          <span class="skip-undo" onclick="unskipMeal(${i},event)">↩ voltei a jantar</span>
        </div>`:`
        <div class="mc-body">
          <div class="mc-food">${m.f}</div>
          ${m.s?`<div class="mc-supp">${m.s}</div>`:''}
          ${m.w?`<div class="mc-warn">⚡ ${m.w}</div>`:''}
          ${m.g?`<div class="mc-gastro">🟣 ${m.g}</div>`:''}
          ${m.skipable?`</div><button class="mc-skip-btn" onclick="skipMeal(${i},event)">🚫 Não vou jantar hoje · ver compensação</button>`:`</div>`}
        `}
      </div></div>`;
    }
  });
  h+='</div>';
  h+=`<div class="total">
    <span class="total-lbl">Total do dia</span>
    <span class="total-val">${d.tot} g</span></div>`;
  if(day!=='fds')
    h+=`<div class="ibox">🐟 Tilápia entra 2x por mês em qualquer jantar no lugar do atum, sardinha ou frango.</div>`;
  if(day!=='fds') h+=renderEnergyWidget();
  const modo=MODOS[getModo()];
  if(getModo()!=='manutencao')
    h+=`<div class="modo-note-meals">${modo.icon} <b>Modo ${modo.label}:</b> ${modo.desc}</div>`;
  return h;
}

function renderWeightCard(){
  const w=loadWeights();
  const today=todayStr();
  const todayVal=w[today];
  const entries=Object.entries(w).sort((a,b)=>a[0].localeCompare(b[0])).slice(-30);

  const goal=parseFloat(localStorage.getItem('plano_wt_goal')||'0');
  const diff=todayVal&&goal?(todayVal-goal).toFixed(1):null;
  const diffCol=diff>0?'var(--ember)':diff<0?'var(--teal)':'var(--muted)';

  const inputHtml=`<div class="wt-input-row">
    <span class="wt-label">⚖️ Peso hoje</span>
    ${todayVal?`<span class="wt-today-val">${todayVal}<small style="font-size:12px;font-family:'DM Sans';color:var(--muted)"> kg</small></span>`:''}
    <input class="wt-input" id="wtInput" type="number" step="0.1" min="30" max="250"
      placeholder="${todayVal||'82.0'}" value="${todayVal||''}">
    <button class="wt-save" onclick="saveWeight()">Salvar</button>
  </div>
  <div class="wt-goal-row">
    <span class="wt-goal-lbl">🎯 Meta</span>
    <input class="wt-input" id="wtGoal" type="number" step="0.1" min="30" max="250"
      placeholder="79.0" value="${goal||''}" style="width:75px">
    <button class="wt-save" onclick="saveWeightGoal()">OK</button>
    ${diff!==null?`<span style="font-size:11.5px;font-weight:600;color:${diffCol}">${diff>0?'+':''}${diff} kg da meta</span>`:''}
  </div>`;

  const stag=checkStagnation();
  if(entries.length<2) return `<div class="wt-card">${inputHtml}${stag?`<div class="wt-stag">${stag}</div>`:''}</div>`;

  const vals=entries.map(e=>e[1]);
  const minV=Math.min(...vals),maxV=Math.max(...vals);
  const range=maxV-minV||0.5;
  const W=320,H=72,pad=10;

  const pts=entries.map((e,i)=>{
    const x=pad+(i/(entries.length-1))*(W-pad*2);
    const y=H-pad-((e[1]-minV)/range)*(H-pad*2);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');

  const last=entries[entries.length-1];
  const lastX=(pad+(1)*(W-pad*2)).toFixed(1);
  const lastY=(H-pad-((last[1]-minV)/range)*(H-pad*2)).toFixed(1);
  const trend=(last[1]-entries[0][1]).toFixed(1);
  const trendColor=trend>0?'var(--ember)':trend<0?'var(--teal)':'var(--muted)';
  const trendSign=trend>0?'+':'';

  return `<div class="wt-card">
    ${inputHtml}
    ${stag?`<div class="wt-stag">${stag}</div>`:''}
    <div class="wt-chart-wrap">
      <svg width="100%" viewBox="0 0 ${W} ${H}" style="overflow:visible;display:block">
        <polyline points="${pts}" fill="none" stroke="var(--teal)" stroke-width="2" stroke-linejoin="round"/>
        <circle cx="${lastX}" cy="${lastY}" r="4" fill="var(--ember)" stroke="var(--bg)" stroke-width="2"/>
      </svg>
      <div class="wt-chart-labels">
        <span>${entries[0][0].slice(5).replace('-','/')}</span>
        <span style="color:${trendColor};font-weight:600">${trendSign}${trend} kg no período</span>
        <span>${last[0].slice(5).replace('-','/')}</span>
      </div>
    </div>
  </div>`;
}

// ── Relatório semanal ────────────────────────────────
function generateReport(){
  const hist=loadHistory(),weights=loadWeights(),energies=loadEnergies();
  const wk=getWeekKey();

  function getWkKey(date){
    const d=new Date(date+'T12:00');
    const day=d.getUTCDay()||7;
    const tmp=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
    tmp.setUTCDate(tmp.getUTCDate()+4-day);
    const y=new Date(Date.UTC(tmp.getUTCFullYear(),0,1));
    const w=Math.ceil((((tmp-y)/86400000)+1)/7);
    return `plano-${tmp.getUTCFullYear()}-W${String(w).padStart(2,'0')}`;
  }

  const week=Object.entries(hist).filter(([date])=>getWkKey(date)===wk);
  if(!week.length){showToast('❌ Sem dados esta semana');return;}

  const avgProt=Math.round(week.reduce((a,[,e])=>a+e.protein,0)/week.length);
  const trainDays=week.filter(([,e])=>e.dayType!=='fds').length;
  const completion=Math.round(week.reduce((a,[,e])=>a+(e.done/e.total),0)/week.length*100);
  const streak=calcStreak(hist);

  const wkW=week.map(([d])=>weights[d]).filter(Boolean);
  const wtLine=wkW.length
    ?`⚖️ Peso: ${Math.min(...wkW).toFixed(1)}–${Math.max(...wkW).toFixed(1)} kg`
    :'⚖️ Peso: não registrado';

  const enVals=week.map(([d,e])=>e.dayType!=='fds'?energies[d]:null).filter(Boolean);
  const avgEn=enVals.length?(enVals.reduce((a,b)=>a+b,0)/enVals.length).toFixed(1):'—';
  const enIcon=avgEn!=='—'?ENERGY_E[Math.round(avgEn)-1]:'';

  const modo=MODOS[getModo()];
  const txt=
`📊 RELATÓRIO SEMANAL — ${wk.replace('plano-','')}
━━━━━━━━━━━━━━━━━━━━━━
🍽 Proteína média: ${avgProt} g/dia
✅ Conclusão: ${completion}%
🏋 Dias de treino: ${trainDays}
⚡ Energia média: ${avgEn} ${enIcon}
${wtLine}
🔥 Sequência atual: ${streak} dias
🎯 Objetivo: ${modo.icon} ${modo.label}
━━━━━━━━━━━━━━━━━━━━━━
Gerado em ${new Date().toLocaleDateString('pt-BR')} pelo Plano Semanal`;

  if(navigator.clipboard){
    navigator.clipboard.writeText(txt)
      .then(()=>showToast('📋 Relatório copiado!'))
      .catch(()=>{showReportModal(txt);});
  } else showReportModal(txt);
}

function showReportModal(txt){
  const old=document.getElementById('reportModal');
  if(old) old.remove();
  const d=document.createElement('div');

// ── Estagnação de peso ───────────────────────────────
function checkStagnation(){
  const weights=loadWeights();
  const goal=parseFloat(localStorage.getItem('plano_wt_goal')||'0');
  if(!goal) return null;
  const last=Object.entries(weights).sort((a,b)=>a[0].localeCompare(b[0])).slice(-14).map(([,v])=>v);
  if(last.length<7) return null;
  const range=Math.max(...last)-Math.min(...last);
  if(range>=0.8) return null;
  const avg=last.reduce((a,b)=>a+b,0)/last.length;
  const dir=avg>goal?'perder peso':'ganhar músculo';
  return `⚠️ Peso estagnado por ${last.length} dias (variação ${range.toFixed(1)} kg). Para ${dir}: revise as calorias ou aumente a intensidade dos treinos.`;
}

// ── SVG Charts ───────────────────────────────────────
function svgLine(entries,{color='var(--teal)',goalVal=null,W=336,H=96}={}){
  if(entries.length<2) return '';
  const vals=entries.map(e=>e.y);
  let minV=Math.min(...vals),maxV=Math.max(...vals);
  if(goalVal!=null){minV=Math.min(minV,goalVal);maxV=Math.max(maxV,goalVal);}
  const pad=1.5;minV=Math.max(0,minV-pad);maxV+=pad;
  const range=maxV-minV||1;
  const pl=34,pr=14,pt=8,pb=22;
  const cW=W-pl-pr,cH=H-pt-pb;
  const tx=i=>pl+(i/(entries.length-1))*cW;
  const ty=v=>pt+(1-(v-minV)/range)*cH;
  const pts=entries.map((e,i)=>`${tx(i).toFixed(1)},${ty(e.y).toFixed(1)}`).join(' ');
  const fX=tx(0).toFixed(1),lX=tx(entries.length-1).toFixed(1);
  const bY=(pt+cH).toFixed(1);
  // linear regression
  const n=entries.length,sx=n*(n-1)/2,sy=vals.reduce((a,b)=>a+b,0);
  const sxy=vals.reduce((a,v,i)=>a+i*v,0),sx2=n*(n-1)*(2*n-1)/6;
  const den=n*sx2-sx*sx;
  const slope=den?((n*sxy-sx*sy)/den):0;
  const intercept=(sy-slope*sx)/n;
  // y-axis ticks
  const ticks=[minV+range*.1,minV+range*.5,minV+range*.9];
  const yAxis=ticks.map(v=>`
    <text x="${pl-4}" y="${(ty(v)+3.5).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--faint)">${v.toFixed(1)}</text>
    <line x1="${pl}" y1="${ty(v).toFixed(1)}" x2="${pl+cW}" y2="${ty(v).toFixed(1)}" stroke="var(--bdr)" stroke-width=".5" opacity=".4"/>`).join('');
  // x labels
  const xi=[0,Math.floor((n-1)/2),n-1];
  const xAxis=xi.map(i=>`<text x="${tx(i).toFixed(1)}" y="${H-4}" text-anchor="middle" font-size="9" fill="var(--faint)">${entries[i].x}</text>`).join('');
  // goal line
  const gLine=goalVal!=null?`<line x1="${pl}" y1="${ty(goalVal).toFixed(1)}" x2="${pl+cW}" y2="${ty(goalVal).toFixed(1)}" stroke="var(--gold)" stroke-width="1.5" stroke-dasharray="4,3" opacity=".8"/>
    <text x="${(pl+cW+3).toFixed(1)}" y="${(ty(goalVal)+4).toFixed(1)}" font-size="9" fill="var(--gold)">${goalVal}</text>`:'';
  // dots
  const dotI=new Set([0,n-3,n-2,n-1].filter(i=>i>=0));
  const dots=[...dotI].map(i=>{const last=i===n-1;return`<circle cx="${tx(i).toFixed(1)}" cy="${ty(entries[i].y).toFixed(1)}" r="${last?4:2.5}" fill="${last?'var(--ember)':color}" stroke="var(--bg)" stroke-width="${last?2:1.5}"/>`;}).join('');
  const aid=`ag${Math.random().toString(36).slice(2,6)}`;
  return `<svg width="100%" viewBox="0 0 ${W} ${H}" style="overflow:visible;display:block">
    <defs><linearGradient id="${aid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity=".2"/>
      <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    ${yAxis}${gLine}
    <polygon points="${pts} ${lX},${bY} ${fX},${bY}" fill="url(#${aid})"/>
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="${fX}" y1="${ty(intercept).toFixed(1)}" x2="${lX}" y2="${ty(intercept+slope*(n-1)).toFixed(1)}" stroke="${color}" stroke-width="1" stroke-dasharray="3,3" opacity=".35"/>
    ${dots}${xAxis}
  </svg>`;
}

function svgBars(entries,{color='var(--teal)',goalVal=null,fixedMax=null,colorFn=null,W=336,H=80}={}){
  if(!entries.length) return '';
  const vals=entries.map(e=>e.y);
  const topV=fixedMax||Math.max(...vals,goalVal||0)*1.12||1;
  const pl=0,pr=0,pt=16,pb=20;
  const cW=W-pl-pr,cH=H-pt-pb;
  const gap=cW/entries.length;
  const bw=Math.max(8,gap*.62);
  const tx=i=>pl+i*gap+gap/2;
  const bh=v=>Math.max(2,(v/topV)*cH);
  const bars=entries.map((e,i)=>{
    const h=bh(e.y),x=(tx(i)-bw/2).toFixed(1),y=(pt+cH-h).toFixed(1);
    const isLast=i===entries.length-1;
    const fill=colorFn?colorFn(e.y):(isLast?'var(--ember)':color);
    return `<rect x="${x}" y="${y}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${fill}" opacity="${isLast?1:.72}"/>
      <text x="${tx(i).toFixed(1)}" y="${(pt+cH-h-4).toFixed(1)}" text-anchor="middle" font-size="9" fill="var(--muted)">${e.y}</text>
      <text x="${tx(i).toFixed(1)}" y="${H-4}" text-anchor="middle" font-size="9" fill="var(--faint)">${e.x}</text>`;
  }).join('');
  const gLine=goalVal!=null?(()=>{const y=(pt+cH-bh(goalVal)).toFixed(1);
    return`<line x1="0" y1="${y}" x2="${cW}" y2="${y}" stroke="var(--gold)" stroke-width="1.5" stroke-dasharray="4,3" opacity=".8"/>`;})():'';
  return `<svg width="100%" viewBox="0 0 ${W} ${H}" style="overflow:visible;display:block">
    ${gLine}${bars}
  </svg>`;
}

function renderCharts(){

  // ── Peso ──

  if(wtArr.length>=2){
    const vals=wtArr.map(e=>e[1]);
    const avg=(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1);
    const trend=(vals[vals.length-1]-vals[0]).toFixed(1);
    const tc=trend>0?'em':trend<0?'':'';
    out+=`<div class="chart-card">
      <div class="chart-hed">
        <div><div class="chart-title">⚖️ Peso</div>
        <div class="chart-sub">Últimos ${wtArr.length} registros · kg</div></div>

        <div class="cstat"><div class="cstat-v">${Math.min(...vals).toFixed(1)}</div><div class="cstat-l">Mínimo</div></div>
        <div class="cstat"><div class="cstat-v">${avg}</div><div class="cstat-l">Média</div></div>

  // ── Proteína ──

      <div class="chart-stats">
        <div class="cstat"><div class="cstat-v">${avg}g</div><div class="cstat-l">Média</div></div>
        <div class="cstat"><div class="cstat-v">${Math.max(...vals)}g</div><div class="cstat-l">Melhor</div></div>
        <div class="cstat"><div class="cstat-v">${vals.filter(v=>v>=150).length}</div><div class="cstat-l">Dias ≥150g</div></div>
      </div></div>`;
  }

  // ── Conclusão ──
  const concArr=hArr.slice(-14).map(([d,e])=>({x:getDOW(d).slice(0,3),y:Math.round(e.done/e.total*100)||0}));
  if(concArr.length>=3){
    const vals=concArr.map(e=>e.y);

      <div class="chart-hed"><div><div class="chart-title">✅ Conclusão</div>

        <div class="cstat"><div class="cstat-v">${Math.max(...vals)}%</div><div class="cstat-l">Melhor</div></div>
        <div class="cstat"><div class="cstat-v">${vals.filter(v=>v>=80).length}</div><div class="cstat-l">Dias ≥80%</div></div>
      </div></div>`;
  }

  // ── Energia ──
  const enArr=hArr.filter(([d,e])=>e.dayType!=='fds'&&energies[d]).slice(-14)
    .map(([d])=>({x:getDOW(d).slice(0,3),y:energies[d]}));
  if(enArr.length>=3){
    const vals=enArr.map(e=>e.y);
    const avg=(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1);
    out+=`<div class="chart-card">
      <div class="chart-hed"><div><div class="chart-title">⚡ Energia no treino</div>

  // ── Água ──
  const waterArr=Object.entries(water).sort((a,b)=>a[0].localeCompare(b[0])).slice(-10)
    .map(([d,v])=>({x:getDOW(d).slice(0,3),y:parseFloat((v/1000).toFixed(1))}));
  if(waterArr.length>=3){
    const vals=waterArr.map(e=>e.y);
    const avg=(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1);
    out+=`<div class="chart-card">
      <div class="chart-hed"><div><div class="chart-title">💧 Hidratação</div>
        <div class="chart-sub">Últimos ${waterArr.length} dias · litros</div></div></div>
      ${svgBars(waterArr,{color:'var(--blue)',goalVal:3.5,fixedMax:5,colorFn:v=>v>=3.5?'var(--teal)':v>=2.5?'var(--blue)':'var(--ember)'})}
      <div class="chart-stats">
        <div class="cstat"><div class="cstat-v bl">${avg}L</div><div class="cstat-l">Média</div></div>
        <div class="cstat"><div class="cstat-v bl">${Math.max(...vals)}L</div><div class="cstat-l">Melhor</div></div>
        <div class="cstat"><div class="cstat-v">${vals.filter(v=>v>=3.5).length}</div><div class="cstat-l">Dias ≥3.5L</div></div>
      </div></div>`;
  }

  if(!out) return `<div class="chart-empty">📈<br>Use o app por alguns dias para ver os gráficos aqui.</div>`;
  return out;
}

// ── Correlação energia × proteína ───────────────────
function renderCorrelation(){
  const hist=loadHistory(),energies=loadEnergies();
  const data=Object.entries(hist)
    .filter(([date,e])=>e.dayType!=='fds'&&energies[date]&&e.total>0)
    .map(([date,e])=>({prot:e.protein,energy:energies[date],pct:e.done/e.total}));
  if(data.length<5) return '';

  const hi=data.filter(d=>d.prot>=150);
  const lo=data.filter(d=>d.prot<150);
  if(!hi.length||!lo.length) return '';

  const avgHi=(hi.reduce((a,d)=>a+d.energy,0)/hi.length).toFixed(1);
  const avgLo=(lo.reduce((a,d)=>a+d.energy,0)/lo.length).toFixed(1);
  const diff=(avgHi-avgLo).toFixed(1);
  if(Math.abs(diff)<0.3) return '';

  return `<div class="corr-card">
    <div class="corr-title">🔬 Correlação: proteína × energia no treino</div>
    <div class="corr-row">
      <div class="corr-item">
        <span class="corr-lbl">Prot. ≥150g (${hi.length} dias)</span>
        <span class="corr-val">${avgHi} ${ENERGY_E[Math.min(4,Math.round(avgHi)-1)]}</span>
        <div class="corr-sub">energia média</div>
      </div>
      <div class="corr-item" style="opacity:.7">
        <span class="corr-lbl">Prot. <150g (${lo.length} dias)</span>
        <span class="corr-val" style="color:var(--muted)">${avgLo} ${ENERGY_E[Math.min(4,Math.max(0,Math.round(avgLo)-1))]}</span>
        <div class="corr-sub">energia média</div>
      </div>
    </div>
    <div style="font-size:11px;color:var(--teal)">
      💡 Com proteína alta você treina <b>+${diff} pontos de energia</b> em média.
    </div>
  </div>`;
}

// ── Google Drive Sync ────────────────────────────────
let gToken=null,gTokenClient=null,gdriveSyncTimer=null;

function gdriveSyncDebounced(){
  clearTimeout(gdriveSyncTimer);
  gdriveSyncTimer=setTimeout(gdriveSave,2500);
}

function gdriveInit(){
  if(!GOOGLE_CLIENT_ID||typeof google==='undefined') return;
  gTokenClient=google.accounts.oauth2.initTokenClient({
    client_id:GOOGLE_CLIENT_ID,
    scope:'https://www.googleapis.com/auth/drive.appdata',
    callback:(resp)=>{
      if(resp.error){
        if(resp.error!=='interaction_required'&&resp.error!=='access_denied')
          showToast('Drive: '+resp.error);
        gToken=null;
        if(sec==='hist') document.getElementById('main').innerHTML=renderHistorico();
        return;
      }
      gToken=resp.access_token;
      localStorage.setItem('plano_gdrive_connected','1');
      gdriveLoad().then(()=>{
        if(sec==='hist') document.getElementById('main').innerHTML=renderHistorico();
      });
    }
  });
  if(localStorage.getItem('plano_gdrive_connected'))
    gTokenClient.requestAccessToken({prompt:''});
}

window.gdriveConnect=function(){
  if(!GOOGLE_CLIENT_ID){showToast('❌ GOOGLE_CLIENT_ID não configurado');return;}
  if(!gTokenClient){showToast('❌ SDK Google não carregado');return;}
  gTokenClient.requestAccessToken({prompt:'consent'});
};

window.gdriveDisconnect=function(){
  if(gToken) try{google.accounts.oauth2.revoke(gToken,()=>{});}catch(e){}
  gToken=null;
  localStorage.removeItem('plano_gdrive_connected');
  localStorage.removeItem('plano_gdrive_synced');
  showToast('Desconectado do Google Drive');
  if(sec==='hist') document.getElementById('main').innerHTML=renderHistorico();
};

window.gdriveSave=async function(){
  if(!gToken) return;
  const backup={version:3,savedAt:new Date().toISOString(),
    history:loadHistory(),weights:loadWeights(),
    water:loadWater(),energy:loadEnergies()};
  try{
    const q=encodeURIComponent("name='plano_nutricao.json'");
    const lr=await fetch(
      `https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id)`,
      {headers:{Authorization:`Bearer ${gToken}`}});
    if(lr.status===401){gToken=null;return;}
    const list=await lr.json();
    const fid=list.files?.[0]?.id;
    const meta=fid?{name:'plano_nutricao.json'}:{name:'plano_nutricao.json',parents:['appDataFolder']};
    const form=new FormData();
    form.append('metadata',new Blob([JSON.stringify(meta)],{type:'application/json'}));
    form.append('file',new Blob([JSON.stringify(backup)],{type:'application/json'}));
    const url=fid
      ?`https://www.googleapis.com/upload/drive/v3/files/${fid}?uploadType=multipart`
      :'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
    await fetch(url,{method:fid?'PATCH':'POST',headers:{Authorization:`Bearer ${gToken}`},body:form});
    const ts=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    localStorage.setItem('plano_gdrive_synced',ts);
    const el=document.getElementById('driveStatus');
    if(el) el.innerHTML=`<b>Google Drive</b> · conectado<br><small>Último sync: ${ts}</small>`;
  }catch(e){}
};

async function gdriveLoad(){
  if(!gToken) return;
  try{
    const q=encodeURIComponent("name='plano_nutricao.json'");
    const lr=await fetch(
      `https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id)`,
      {headers:{Authorization:`Bearer ${gToken}`}});
    if(lr.status===401){gToken=null;return;}
    const list=await lr.json();
    const fid=list.files?.[0]?.id;
    if(!fid){gdriveSave();return;}
    const fr=await fetch(`https://www.googleapis.com/drive/v3/files/${fid}?alt=media`,
      {headers:{Authorization:`Bearer ${gToken}`}});
    const data=await fr.json();
    if(data.history){
      const local=loadHistory(),today=todayStr();
      const merged={...local,...data.history};
      if(local[today]) merged[today]=local[today];
      localStorage.setItem(HIST_KEY,JSON.stringify(merged));
    }
    if(data.weights){
      const lw=loadWeights();
      localStorage.setItem(WEIGHT_KEY,JSON.stringify({...data.weights,...lw}));
    }
    if(data.water){
      const lw=loadWater();
      localStorage.setItem(WATER_KEY,JSON.stringify({...data.water,...lw}));
    }
    if(data.energy){
      const le=loadEnergies();
      localStorage.setItem(ENERGY_KEY,JSON.stringify({...data.energy,...le}));
    }
    showToast('☁️ Sincronizado com Drive');
  }catch(e){gToken=null;}
}

// ── Water counter ────────────────────────────────────
const WATER_KEY='plano_water_v1';
const WATER_ML=250,WATER_GOAL=3500;

function loadWater(){try{return JSON.parse(localStorage.getItem(WATER_KEY)||'{}')}catch(e){return{}}}

window.tapWater=function(){
  const w=loadWater(),t=todayStr();
  w[t]=((w[t]||0)+WATER_ML);
  if(w[t]>WATER_GOAL+2000) w[t]=0;
  localStorage.setItem(WATER_KEY,JSON.stringify(w));
  renderWaterDiv();
};

window.resetWater=function(e){
  e.stopPropagation();
  const w=loadWater();w[todayStr()]=0;
  localStorage.setItem(WATER_KEY,JSON.stringify(w));
  renderWaterDiv();
};

function renderWaterDiv(){
  const ml=loadWater()[todayStr()]||0;
  const pct=Math.min(100,(ml/WATER_GOAL)*100);
  const L=(ml/1000).toFixed(1);
  const done=ml>=WATER_GOAL;
  const col=done?'var(--teal)':'var(--blue)';
  const el=document.getElementById('waterDiv');
  if(!el)return;
  el.innerHTML=`💧 <span style="flex:1"><b style="color:${col}">${L} L</b> / 3,5 L · toque +250 ml${
    ml>0?` <span class="water-reset" onclick="resetWater(event)">↺</span>`:''
  }</span><span style="font-size:11px;font-weight:600;color:${col}">${Math.round(pct)}%</span>
  <div class="water-bar" style="position:absolute;bottom:0;left:0;right:0;border-radius:0 0 8px 8px">
    <div class="water-fill" style="width:${pct}%;background:${col}"></div>
  </div>`;
  el.style.position='relative';
  el.style.paddingBottom='9px';
}

// ── Streak ───────────────────────────────────────────
function calcStreak(hist){
  let streak=0;
  const d=new Date();
  const today=todayStr();
  for(let i=0;i<365;i++){
    const ds=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const e=hist[ds];
    if(!e||!e.total){
      if(ds===today){d.setDate(d.getDate()-1);continue;}
      break;
    }
    if(e.done/e.total>=0.8) streak++;
    else break;
    d.setDate(d.getDate()-1);
  }
  return streak;
}

function calcBestStreak(hist){
  const dates=Object.keys(hist).sort();
  let best=0,cur=0,prev=null;
  dates.forEach(ds=>{
    const e=hist[ds];
    if(!e||!e.total){cur=0;prev=null;return;}
    if(e.done/e.total>=0.8){
      if(prev){
        const d1=new Date(prev+'T12:00'),d2=new Date(ds+'T12:00');
        if((d2-d1)/(86400000)===1) cur++;
        else cur=1;
      } else cur=1;
      if(cur>best) best=cur;
      prev=ds;
    } else{cur=0;prev=null;}
  });
  return best;
}

const NOTIF_PREF='plano_notif_v1';
let _notifTimers=[];

function clearNotifTimers(){_notifTimers.forEach(t=>clearTimeout(t));_notifTimers=[];}

window.toggleNotifications=async function(){
  const on=localStorage.getItem(NOTIF_PREF)==='1';
  if(!on){
    if(!('Notification' in window)){showToast('❌ Não suportado neste browser');return;}
    const p=await Notification.requestPermission();
    if(p!=='granted'){showToast('❌ Permissão negada');return;}
    localStorage.setItem(NOTIF_PREF,'1');
    scheduleNotifications();
    showToast('🔔 Lembretes ativados');
  } else{
    clearNotifTimers();
    localStorage.removeItem(NOTIF_PREF);
    showToast('🔕 Lembretes desativados');
  }
  if(sec==='hist') document.getElementById('main').innerHTML=renderHistorico();
};

function scheduleNotifications(){
  clearNotifTimers();
  if(Notification.permission!=='granted') return;
  if(localStorage.getItem(NOTIF_PREF)!=='1') return;
  const now=new Date(),dt=getCurrentDayType();
  DAYS[dt].meals.forEach(meal=>{
    if(!meal.t||meal.type==='train') return;
    const m=meal.t.match(/(\d{1,2})h(\d{2})/);
    if(!m) return;
    const target=new Date();
    target.setHours(parseInt(m[1]),parseInt(m[2]),0,0);
    const diff=target-now;
    if(diff>0&&diff<14*3600000){
      _notifTimers.push(setTimeout(()=>{
        new Notification(`🍽 ${meal.n}`,{
          body:meal.sum||'',icon:'./icon-192.png',
          tag:`meal-${meal.t}`,silent:false
        });
      },diff));
    }
  });
}

const HIST_KEY='plano_hist_v1';
let histView='day'; // day | week | month

function todayStr(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function loadHistory(){
  try{return JSON.parse(localStorage.getItem(HIST_KEY)||'{}')}catch(e){return{}}
}

function saveToHistory(){
  const hist=loadHistory();
  const today=todayStr();
  const d=DAYS[day];
  const meals=d.meals.filter(m=>m.p);
  const earned=meals.reduce((a,m,i)=>{
    const ri=d.meals.indexOf(m);
    const isSkip=m.skipable&&skipped[`${day}-skip-${ri}`];
    return a+(isSkip?m.skipProt:(chk[`${day}-${ri}`]?m.p:0));
  },0);
  const goal=meals.reduce((a,m,i)=>{
    const ri=d.meals.indexOf(m);
    return a+(m.skipable&&skipped[`${day}-skip-${ri}`]?m.skipProt:m.p);
  },0);
  const doneCount=meals.filter((m,i)=>{
    const ri=d.meals.indexOf(m);
    return chk[`${day}-${ri}`]||(m.skipable&&skipped[`${day}-skip-${ri}`]);
  }).length;
  const mealNames=d.meals.filter(m=>m.p).map((m,i)=>{
    const ri=d.meals.indexOf(m);
    const isDone=chk[`${day}-${ri}`];
    const isSkip=m.skipable&&skipped[`${day}-skip-${ri}`];
    return{name:m.n.replace(' · leve','').replace(' · alcatra 🥩',''),
           done:isDone,skip:isSkip};
  });
  hist[today]={
    dayType:day,
    protein:earned,
    goal:goal,
    done:doneCount,
    total:meals.length,
    meals:mealNames,
    skippedDinner:!!(day==='fds'&&skipped[`fds-skip-3`]),
    ts:new Date().toISOString()
  };
  localStorage.setItem(HIST_KEY,JSON.stringify(hist));
  gdriveSyncDebounced();
}

function renderHistWeek(hist){
  // Group by ISO week
  const weeks={};
  Object.entries(hist).forEach(([date,e])=>{
    const d=new Date(date+'T12:00:00');
    const day=d.getUTCDay()||7;
    const tmp=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
    tmp.setUTCDate(tmp.getUTCDate()+4-day);
    const y=new Date(Date.UTC(tmp.getUTCFullYear(),0,1));
    const wk=Math.ceil((((tmp-y)/86400000)+1)/7);
    const wkey=`${tmp.getUTCFullYear()}-W${String(wk).padStart(2,'0')}`;
    if(!weeks[wkey])weeks[wkey]=[];
    weeks[wkey].push({date,e});
  });
  const sorted=Object.entries(weeks).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,8);
  if(!sorted.length) return `<div class="hempty"><span class="hempty-icon">📊</span>Sem dados ainda.</div>`;
  return sorted.map(([wk,days])=>{
    const prots=days.map(d=>d.e.protein);
    const avg=Math.round(prots.reduce((a,b)=>a+b,0)/prots.length);
    const maxP=Math.max(...prots,1);
    const trainDays=days.filter(d=>d.e.dayType!=='fds').length;
    const completion=Math.round(days.reduce((a,d)=>a+(d.e.done/d.e.total),0)/days.length*100);
    const bars=days.map(d=>{
      const h=Math.round((d.e.protein/maxP)*40);
      const isToday=d.date===todayStr();
      return `<div class="wbar-wrap">
        <div class="wbar ${isToday?'today':''}" style="height:${h}px"></div>
        <span class="wbar-lbl">${getDOW(d.date)}</span>
      </div>`;
    }).join('');
    const wkWeights=days.map(d=>loadWeights()[d.date]).filter(Boolean);
    const avgWt=wkWeights.length?(wkWeights.reduce((a,b)=>a+b,0)/wkWeights.length).toFixed(1):'—';
    return `<div class="wcard">
      <div class="wcard-title">${wk.replace('-W',' · Sem ')}</div>
      <div class="wcard-stats" style="grid-template-columns:repeat(4,1fr)">
        <div class="wstat"><div class="wstat-v">${avg}g</div><div class="wstat-l">Prot. média</div></div>
        <div class="wstat"><div class="wstat-v">${trainDays}</div><div class="wstat-l">Treinos</div></div>
        <div class="wstat"><div class="wstat-v">${completion}%</div><div class="wstat-l">Conclusão</div></div>
        <div class="wstat"><div class="wstat-v">${avgWt}${avgWt!=='—'?' kg':''}</div><div class="wstat-l">Peso médio</div></div>
      </div>
      <div class="wbars">${bars}</div>
    </div>`;
  }).join('');
}

function renderHistMonth(hist){
  const now=new Date();
  const curMonth=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const months={};
  Object.entries(hist).forEach(([date,e])=>{
    const m=date.slice(0,7);
    if(!months[m])months[m]=[];
    months[m].push({date,e});
  });
  const sorted=Object.entries(months).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,6);
  if(!sorted.length) return `<div class="hempty"><span class="hempty-icon">📈</span>Sem dados ainda.</div>`;
  const mNames=['','Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  return sorted.map(([m,days])=>{
    const[y,mo]=m.split('-');
    const prots=days.map(d=>d.e.protein);
    const avg=Math.round(prots.reduce((a,b)=>a+b,0)/prots.length);
    const best=Math.max(...prots);
    const trainDays=days.filter(d=>d.e.dayType!=='fds').length;
    const streak=days.filter(d=>d.e.protein>=130).length;
    const isCur=m===curMonth;
    const moWeights=days.map(d=>loadWeights()[d.date]).filter(Boolean);
    const avgMoWt=moWeights.length?(moWeights.reduce((a,b)=>a+b,0)/moWeights.length).toFixed(1):'—';
    const minMoWt=moWeights.length?Math.min(...moWeights).toFixed(1):'—';
    return `<div class="wcard" style="${isCur?'border-color:var(--ember)':''}">
      <div class="wcard-title" style="${isCur?'color:var(--ember-s)':''}">
        ${mNames[parseInt(mo)]} ${y} ${isCur?'· Atual':''}
      </div>
      <div class="mcard-stats">
        <div class="mstat"><div class="mstat-v">${avg}g</div><div class="mstat-l">Proteína média diária</div></div>
        <div class="mstat hi"><div class="mstat-v">${best}g</div><div class="mstat-l">Melhor dia</div></div>
        <div class="mstat"><div class="mstat-v">${days.length}</div><div class="mstat-l">Dias registrados</div></div>
        <div class="mstat"><div class="mstat-v">${trainDays}</div><div class="mstat-l">Dias de treino</div></div>
        <div class="mstat"><div class="mstat-v">${streak}</div><div class="mstat-l">Dias acima de 130g</div></div>
        <div class="mstat"><div class="mstat-v">${Math.round(days.reduce((a,d)=>a+(d.e.done/d.e.total),0)/days.length*100)}%</div><div class="mstat-l">Taxa de conclusão</div></div>
        <div class="mstat"><div class="mstat-v">${avgMoWt}${avgMoWt!=='—'?' kg':''}</div><div class="mstat-l">Peso médio</div></div>
        <div class="mstat"><div class="mstat-v">${minMoWt}${minMoWt!=='—'?' kg':''}</div><div class="mstat-l">Menor peso</div></div>
      </div>
    </div>`;
  }).join('');
}

document.getElementById('fileInput').addEventListener('change',function(e){
  const file=e.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      const data=JSON.parse(ev.target.result);
      const incoming=data.history||data;
      if(typeof incoming!=='object')throw new Error('Formato inválido');
      const existing=loadHistory();
      // Merge: incoming + existing, incoming wins on conflict
      const merged={...existing,...incoming};
      localStorage.setItem(HIST_KEY,JSON.stringify(merged));
      showToast(`✅ ${Object.keys(incoming).length} dias importados`);
      if(sec==='hist') document.getElementById('main').innerHTML=renderHistorico();
    }catch(err){
      showToast('❌ Arquivo inválido ou corrompido');
    }
  };
  reader.readAsText(file);
  this.value='';
});

  }
});

// ── Init ───────────────────────────────────────────
setColor(DAYS[day].color);
document.querySelectorAll('.pill').forEach(p=>p.classList.toggle('on',p.dataset.d===day));
render();
renderWaterDiv();
renderModoPill();
scheduleNotifications();
</script>
<div class="toast" id="toast"></div>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
</script>
